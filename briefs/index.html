<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BarryYJJ AI 简报</title>
<link rel="canonical" href="https://barryai.cn/briefs/">
<link rel="stylesheet" href="/briefs/css/main.css?v=202609101200">
</head>
<body>
<div class="page-frame">
  <a class="barry-rs-home" href="https://barryai.cn/" aria-label="返回 Barry RS 首页" title="返回 Barry RS 首页"><span class="brs-top" aria-hidden="true">BARRY</span><span class="brs-bot" aria-hidden="true">RS</span></a>
  <div class="corner-meta">
    <div class="brand">from BarryYJJ &nbsp;|&nbsp; 🌋 Token燃烧</div>
    <div>每日 AI 卖方研报跟踪</div>
  </div>

  <main class="gate-card">
    <div class="hero">
      <h1>BarryYJJ AI 简报</h1>
      <p class="subtitle">
        每日四次自动汇总卖方研报里的 AI 信号，<br>
        Claude Opus 提炼 3-6 条要点直送桌面。
      </p>
    </div>

    <section id="gate-preview" class="gate-preview" aria-labelledby="gate-preview-title">
      <h2 id="gate-preview-title" class="gate-preview-title">最新一期预览</h2>
      <p class="gate-preview-status" data-preview-status aria-live="polite">正在读取最新一期…</p>
      <dl class="gate-preview-meta" data-preview-meta></dl>
      <ul class="gate-preview-headlines" data-preview-headlines hidden></ul>
      <div class="gate-preview-keywords" data-preview-keywords hidden aria-label="本期热词"></div>
      <p class="gate-preview-note">留下联系方式即可阅读全文与全部归档，一次填写，OpenRouter 与 Token & GPU 看板同样通行。</p>
    </section>

    <form id="gate-form" class="gate-form" novalidate>
      <div class="field">
        <label for="f-name">姓名 <span class="req">*</span></label>
        <input type="text" id="f-name" name="name" required autocomplete="name">
      </div>

      <div class="field">
        <label for="f-org">机构 / 公司 <span class="req">*</span></label>
        <input type="text" id="f-org" name="org" required autocomplete="organization">
      </div>

      <div class="field">
        <label for="f-contact">微信号 或 手机号 <span class="req">*</span></label>
        <input type="text" id="f-contact" name="contact" required>
      </div>

      <div class="field">
        <label for="f-msg">留言（选填）</label>
        <textarea id="f-msg" name="msg" rows="2" placeholder="例如：哪个方向想看更多"></textarea>
      </div>

      <button type="submit" id="submit-btn" class="submit-btn">
        解锁今日简报
      </button>

      <div id="err-msg" class="err-msg" hidden></div>
    </form>

    <p class="footer-note">
      仅供研究参考 · 不构成投资建议 · 个人技术 portfolio
    </p>
  </main>
</div>

<script src="/briefs/js/cb-v2.js"></script>
<script src="/briefs/js/barry-access.js?v=202609101200"></script>
<script src="/briefs/js/preview.js?v=202609101200"></script>
<script src="/briefs/js/form.js?v=202609101200"></script>
</body>
</html>
