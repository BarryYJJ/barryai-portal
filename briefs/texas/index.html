<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="无限注德州扑克现金桌：单挑、3 人、6 人可切换，盲注 10/20，带按位置的教练提示、行动路线和牌谱导出。">
<meta name="theme-color" content="#101614">
<link rel="icon" href="/texas/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/texas/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/texas/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="德州扑克">
<title>德州扑克</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: a card-room table seen from your chair; felt oval left, coach + hand log on a side rail (stacks under on phones). One deliberate dark world. */
:root{
  color-scheme: dark;
  --room:#101614; --panel:#18211e; --panel-2:#1f2a26; --line:#2c3b35;
  --felt:#21574a; --felt-deep:#153a30; --rail:#3b2519; --rail-hi:#6b4429;
  --ink:#eef1ea; --muted:#9fb1a8; --brass:#d8ab4c; --brass-ink:#1c1508;
  --card:#fbfaf5; --card-ink:#1b1d20; --card-red:#c3262d;
  --good:#7fd6a0; --warn:#f0c65a; --bad:#ef7a6e;
  --f-display:'Bricolage Grotesque','PingFang SC','Hiragino Sans GB',system-ui,sans-serif;
  --f-body:'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
  --f-num:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --cw:clamp(40px,min(10.5vw,8vh),64px);
}
html,body{background:var(--room);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 0}
button{font:inherit;color:inherit}
.app{max-width:1180px;margin:0 auto;display:grid;gap:16px;grid-template-columns:minmax(0,1fr) 330px;align-items:start}
@media (max-width:920px){.app{grid-template-columns:minmax(0,1fr)}}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:.01em;margin:0;text-wrap:balance}
.pill{font-family:var(--f-num);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-variant-numeric:tabular-nums}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--muted)}
.ghost[aria-pressed="true"]{color:var(--brass);border-color:var(--brass)}
.ghost.danger{color:var(--bad);border-color:var(--bad)}

/* table */
.tablecol{display:grid;gap:0;min-width:0}
.table{position:relative;background:radial-gradient(ellipse 80% 70% at 50% 45%,var(--felt) 0%,var(--felt-deep) 78%);
  border:12px solid var(--rail);border-radius:180px/130px;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.05),inset 0 14px 50px rgba(0,0,0,.45),0 0 0 2px var(--rail-hi),0 18px 40px rgba(0,0,0,.5);
  padding:14px 18px;display:grid;gap:6px;justify-items:center;align-content:space-between}
@media (max-width:640px){.table{border-width:9px;border-radius:56px;padding:14px 8px}}
.dock{position:sticky;bottom:0;z-index:5;display:grid;gap:6px;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,var(--room) 80%,rgba(16,22,20,0))}
@media (max-height:820px){.print{display:none}}
.seat{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.seat-row{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:nowrap;height:48px}
@media (max-width:640px){
  .seat-row .pile{display:none}
  .seat-row{height:40px}
  .betzone{height:38px}
  #resultbox{height:52px}
  header{flex-wrap:nowrap;gap:8px}
  .brand{gap:8px}
  .brand h1{font-size:19px}
  .brand .bl{display:none}
  .hbtns{gap:6px;flex-wrap:nowrap}
  .hbtns .ghost{padding:5px 9px;font-size:12px;white-space:nowrap}
  .actbadge{top:calc(46px + var(--cw)*.7)}
  /* phone action bar: sizes on one scrolling row, slider, then Fold | Call | Raise side by side */
  .dock .actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px;min-height:0}
  .dock .actions .btn{min-width:0;padding:11px 4px;font-size:14px}
  .dock .actions .raisebox,.actions .rrow{display:contents}
  .dock .actions .quick{grid-column:1/-1;grid-row:1;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .dock .actions .q{flex:none;white-space:nowrap}
  .dock .actions .rrow input{grid-column:1/-1;grid-row:2}
  .dock .actions .btn.fold{grid-row:3;grid-column:1}
  .dock .actions .btn.call{grid-row:3;grid-column:2}
  .dock .actions #rbtn{grid-row:3;grid-column:3}
  .dock .actions .waiting,.actions .next{grid-column:1/-1;justify-self:center}
}
.who{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:4px 12px 4px 6px}
.who .nm{font-family:var(--f-display);font-weight:700;font-size:15px}
.who .stk{font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums;color:var(--brass)}
.who .role{font-size:11px;color:var(--muted);letter-spacing:.04em}
.seat.turn .who{border-color:var(--brass);box-shadow:0 0 0 3px rgba(216,171,76,.18)}
.dbtn{width:22px;height:22px;border-radius:50%;background:var(--brass);color:var(--brass-ink);font:800 11px/22px var(--f-display);text-align:center;box-shadow:0 1px 0 rgba(0,0,0,.5)}
.dbtn.off{background:transparent;box-shadow:none}
.hole{display:flex;gap:6px}
.betzone{height:44px;display:flex;align-items:center;gap:8px}
#resultbox{height:60px;display:grid;place-items:center;width:100%}
.amt{font-family:var(--f-num);font-weight:700;font-size:13px;background:rgba(0,0,0,.35);border-radius:6px;padding:1px 7px;font-variant-numeric:tabular-nums}
.center{display:grid;gap:6px;justify-items:center;width:100%}
.board{display:flex;gap:6px;flex-wrap:nowrap}
.boardrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;width:100%}
.boardrow .board{grid-column:2}
.potline{grid-column:3;justify-self:start;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:72px}
.potnum{display:flex;align-items:center;gap:6px}
@media (max-width:640px){.boardrow{grid-template-columns:1fr 1fr;gap:8px 16px}.boardrow .board{grid-column:1/-1;grid-row:1;justify-self:center}.deck{grid-column:1;grid-row:2}.potline{grid-column:2;grid-row:2}}
.potline .lbl{font-size:12px;color:var(--muted);letter-spacing:.06em}
.print{font-family:var(--f-display);font-weight:700;font-size:11px;letter-spacing:.32em;color:rgba(216,171,76,.32);text-transform:uppercase;text-align:center}

/* cards */
.card{width:var(--cw);aspect-ratio:5/7;max-width:100%;background:var(--card);color:var(--card-ink);border-radius:7px;position:relative;
  box-shadow:0 2px 0 rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.35);font-family:var(--f-display)}
.card{box-sizing:border-box}
/* slots own the size; a card inside can never push the layout */
.cslot{width:var(--cw);aspect-ratio:5/7;position:relative;flex:none}
.cslot>.card{position:absolute;inset:0;width:100%;height:100%;max-width:none}
.bslot:not(.filled){border:1.5px dashed rgba(255,255,255,.16);border-radius:7px;box-sizing:border-box}
.deck{grid-column:1;justify-self:end;position:relative;width:var(--cw);aspect-ratio:5/7}
.deck .card{position:absolute;inset:0;width:100%}
.deck .card:nth-child(1){transform:translate(-4px,4px)}
.deck .card:nth-child(2){transform:translate(-2px,2px)}
.fly{position:absolute;z-index:20;transform-origin:0 0;pointer-events:none;margin:0}
.card.red{color:var(--card-red)}
.card .cr{position:absolute;top:4px;left:6px;font-weight:800;font-size:calc(var(--cw)*.31);line-height:1;letter-spacing:-.04em}
.card .cs{position:absolute;top:calc(var(--cw)*.36);left:6px;font-size:calc(var(--cw)*.22);line-height:1}
.card .cb{position:absolute;right:5px;bottom:3px;font-size:calc(var(--cw)*.55);line-height:1}
.card.back{background:repeating-linear-gradient(45deg,#7a1e19 0 5px,#932a20 5px 10px);border:3px solid #f1ebdd}
.card.mini{--cw:34px}
.slot{width:var(--cw);aspect-ratio:5/7;border:1.5px dashed rgba(255,255,255,.16);border-radius:7px}
@keyframes deal{from{transform:translateY(-10px) scale(.96)}to{transform:none}}

/* chips */
/* chips seen at a 3/4 angle: striped edge band, oval face, value printed only on the top chip */
.pile{display:flex;align-items:flex-end;gap:3px}
.col{position:relative;width:40px;flex:none}
/* each chip = striped edge band + a vector casino-chip face squashed to 60% (so the printed value is foreshortened too) */
.chip{position:absolute;left:0;width:40px;height:28px;border-radius:20px/12px;
  background:linear-gradient(to bottom,rgba(255,255,255,.12),rgba(0,0,0,.25)),repeating-linear-gradient(90deg,var(--cc) 0 7px,var(--ce) 7px 11px);
  box-shadow:0 2px 3px rgba(0,0,0,.45)}
.chip .face{position:absolute;left:0;top:0;width:40px;height:24px;display:block}

/* action bar */
.status{text-align:center;color:var(--muted);font-size:13px;min-height:20px}
.status b{color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:98px;box-sizing:border-box}
.actions .waiting,.actions .next{align-self:center}
.btn{font-weight:700;font-size:15px;padding:12px 18px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;min-width:104px}
.btn:hover{filter:brightness(1.12)}
.btn:focus-visible,.ghost:focus-visible,.q:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn.fold{background:#3b2422;border-color:#5c352f}
.btn.call{background:#1e4c3d;border-color:#2d6b56}
.btn.raise{background:var(--brass);border-color:#ecc670;color:var(--brass-ink)}
.btn.next{background:var(--brass);color:var(--brass-ink);border-color:#ecc670;min-width:180px}
.btn:disabled{opacity:.5;cursor:default}
.raisebox{display:flex;flex-direction:column;gap:8px;flex:1 1 280px;min-width:0}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.q{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:4px 9px;font-size:12px;cursor:pointer}
.q:hover{color:var(--ink);border-color:var(--muted)}
.rrow{display:flex;gap:10px;align-items:center}
.rrow input{flex:1;min-width:0;accent-color:var(--brass)}
.waiting{color:var(--muted);padding:12px;display:flex;align-items:center;gap:8px}
.dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--brass);margin:0 2px;animation:blink 1s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.25}}

/* result */
.result{background:rgba(9,18,15,.72);border:1px solid rgba(216,171,76,.4);border-radius:12px;padding:10px 14px;text-align:center;max-width:440px}
.result .big{font-family:var(--f-display);font-weight:800;font-size:18px}
.result .sub{color:var(--muted);font-size:12.5px}

/* side rail */
.rail{display:grid;gap:12px;min-width:0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.box h2{font-family:var(--f-display);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);margin:0 0 8px}
.coach p{margin:6px 0}
.coach .hand{font-weight:700;font-size:15px}
.coach .draw{color:var(--warn)}
.coach .tip{background:var(--panel-2);border-left:3px solid var(--brass);padding:8px 10px;border-radius:0 8px 8px 0}
.coach .why{color:var(--muted);font-size:12.5px}
.meter{position:relative;height:10px;border-radius:5px;background:#0c1311;margin:18px 0 6px;overflow:visible}
.meter .fill{position:absolute;inset:0 auto 0 0;border-radius:5px;background:linear-gradient(90deg,#2e7d62,var(--good))}
.meter .need{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--warn)}
.meter .need span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--warn);white-space:nowrap}
.mlbl{display:flex;justify-content:space-between;font-family:var(--f-num);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.log{max-height:380px;overflow:auto;font-size:13px;display:grid;gap:10px;padding-right:4px}
.blinds{color:var(--muted);font-size:12.5px}
.sthead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sthead b{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass)}
.sthead .bd{font-family:var(--f-num);font-weight:700;color:var(--ink);letter-spacing:.02em}
.sthead .bd .r{color:#ec6f66}
.sthead .pt{font-family:var(--f-num);font-size:11.5px;color:var(--muted);margin-left:auto}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.acts .arr{color:var(--muted);font-size:12px}
.act{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:3px 8px;font-size:12.5px;white-space:nowrap}
.act .pw{font-size:11px;font-weight:700}
.act.me .pw{color:var(--brass)}
.act.cl .pw{color:#86c9d6}
.act.raise{border-color:rgba(216,171,76,.55)}
.act.fold{opacity:.6}
.pathres{color:var(--brass);font-weight:700}
.log .empty{color:var(--muted)}
.log div.res{color:var(--brass)}
.hist p{margin:0 0 8px}
.hist textarea{width:100%;box-sizing:border-box;height:160px;margin-top:8px;background:#0c1311;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px/1.5 var(--f-num);resize:vertical}
.q.danger{color:var(--bad);border-color:var(--bad)}
#seat1{position:relative}
.actbadge{position:absolute;top:calc(54px + var(--cw)*.7);left:calc(50% + var(--cw) + 18px);transform:translateY(-50%);
  white-space:nowrap;font-weight:700;font-size:14px;padding:6px 12px;border-radius:999px;
  background:rgba(8,16,13,.8);border:1px solid rgba(255,255,255,.14);color:var(--ink);animation:pop .25s ease-out}
.actbadge.raise{background:var(--brass);border-color:#ecc670;color:var(--brass-ink)}
.actbadge.call,.actbadge.check{background:#1e4c3d;border-color:#2d6b56}
.actbadge.fold{color:var(--muted)}
.actbadge.think{color:var(--muted);font-weight:500}
.actbadge.old{opacity:.5}
@keyframes pop{from{transform:translateY(-50%) scale(.8)}to{transform:translateY(-50%) scale(1)}}
@media (max-width:640px){.actbadge{font-size:12px;padding:4px 9px;left:calc(50% + var(--cw) + 10px)}}
@media (prefers-reduced-motion:reduce){.actbadge{animation:none}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}}

/* ---------- multi-seat table (2 / 3 / 6 players) ---------- */
.seg{display:flex}
.seg .ghost{border-radius:0;margin-left:-1px}
.seg .ghost:first-child{border-radius:8px 0 0 8px;margin-left:0}
.seg .ghost:last-child{border-radius:0 8px 8px 0}
.table{position:relative;display:block;padding:0;height:clamp(520px,66vh,620px);border-radius:220px/170px}
#seats{position:absolute;inset:0}
.seat{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:5px;width:auto;z-index:2}
.seat.bot{--cw:42px}
.seat.me{--cw:clamp(50px,min(8vw,8.5vh),62px)}
.info{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:3px 11px 3px 4px;white-space:nowrap}
.info .nm{font-family:var(--f-display);font-weight:700;font-size:14px}
.info .role{font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.info .stk{font-family:var(--f-num);font-weight:700;font-size:13px;color:var(--brass);font-variant-numeric:tabular-nums}
.seat.turn .info{border-color:var(--brass);box-shadow:0 0 0 3px rgba(216,171,76,.2)}
.seat.folded .hole{opacity:.32}
.seat.folded .info{opacity:.6}
.dbtn{width:20px;height:20px;font-size:10px;line-height:20px}
.actb{height:24px;display:flex;align-items:center;justify-content:center}
.actbadge{position:static;transform:none;top:auto;left:auto;font-size:12px;padding:3px 9px;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.8)}to{transform:none}}
.betz{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;pointer-events:none;z-index:1}
.center{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:auto;--cw:clamp(40px,min(6vw,8vh),56px);z-index:1}
.boardrow{display:flex;align-items:center;gap:12px;width:auto}
.board{gap:5px}
.potrow{display:flex;align-items:center;gap:14px;min-height:52px}
.deck{position:relative;width:calc(var(--cw)*.7);aspect-ratio:5/7;justify-self:auto;flex:none}
.potline{flex-direction:row;height:34px;gap:8px}
#resultbox{height:58px;min-width:240px}
.rvl{display:grid;gap:8px;margin-bottom:8px}
.rv{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n c" "s s";gap:2px 8px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:6px}
.rvn{grid-area:n;font-weight:700;display:flex;flex-direction:column}
.rvn small{font-weight:400;color:var(--muted);font-size:11.5px}
.rvc{grid-area:c;display:flex;gap:4px}
.rvs{grid-area:s;color:var(--muted);font-size:12.5px}
.ghostbtn{background:transparent;min-width:0;font-weight:600;color:var(--muted)}
.ev{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;background:var(--panel-2)}
.evh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.evs{font-family:var(--f-display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.evt{font-weight:700}
.ev .evalbtn{margin-top:8px;color:var(--brass);border-color:rgba(216,171,76,.5)}
.ev p{margin:6px 0 0}
.vd{margin-left:auto;font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;border:1px solid currentColor}
.vd.good{color:var(--good)}.vd.ok{color:#b9c7c0}.vd.warn{color:var(--warn)}.vd.bad{color:var(--bad)}
.h2b{margin-top:14px!important}
@media (max-width:640px){
  header{flex-wrap:wrap}
  .brand .bl{display:none}
  .table{height:600px;border-radius:52px}
  .seat,.betz{left:var(--mx);top:var(--my)}
  .seat.bot{--cw:30px}
  .seat.me{--cw:48px}
  .info{padding:2px 8px 2px 3px;gap:4px}
  .info .nm{font-size:12px}
  .info .stk{font-size:11.5px}
  .info .role{font-size:9.5px}
  .betz .pile{display:none}
  .center{--cw:36px}
  .boardrow{gap:6px}
  .board{gap:4px}
  .actbadge{font-size:11px;padding:2px 7px}
  #resultbox{height:50px;min-width:0}
}
</style>

</head>
<body>
<div class="app">
  <header>
    <div class="brand"><h1>德州扑克</h1><span class="pill" id="handno">第 1 手</span><span class="pill" id="netpill">本场 +0</span><span class="pill bl">盲注 10 / 20 · 买入 2000</span></div>
    <div class="hbtns">
      <div class="seg" id="modeseg" role="group" aria-label="桌型">

<script>
const SB=10, BB=20, BUYIN=2000;
const RANKS='23456789TJQKA', SUITS=['♠','♥','♦','♣'];
const STREET=['Preflop','Flop','Turn','River'];
const DENOMS=[{v:500,c:'#6c45a8',e:'#eadfff',d:'#3f2470'},{v:100,c:'#25292d',e:'#e6e6e6',d:'#0b0d0f'},{v:50,c:'#d07a22',e:'#fff1dc',d:'#8a4a10'},{v:20,c:'#b3302a',e:'#ffe2de',d:'#721b17'},{v:10,c:'#2d6db3',e:'#e0edff',d:'#173f6e'},{v:5,c:'#ebe7db',e:'#6f6b60',d:'#a8a395'}];
const $=s=>document.querySelector(s);
const RL=r=>r===8?'10':RANKS[r];
const lbl=c=>RL(c>>2)+SUITS[c&3];
const r10=x=>Math.round(x/10)*10;
const pct=x=>Math.round(x*100)+'%';

/* ---------- table formats ---------- */
// Seat 0 is always you (bottom). Action moves to seat+1 (clockwise).
const MODES={
  2:{label:'单挑',pos:['BTN','BB']},
  3:{label:'3 人',pos:['BTN','SB','BB']},
  6:{label:'6 人',pos:['BTN','SB','BB','UTG','HJ','CO']},
};
const BOTS={
  2:[{name:'Claude'}],
  3:[{name:'Claude'},{name:'Ethan'}],
  6:[{name:'Claude'},{name:'Ethan'},{name:'Oliver'},{name:'Mike'},{name:'Leo'}],
};
// loose: how wide it opens vs the baseline chart; agg: how often it bets/raises; call: extra margin it wants before calling; bluff: bluff frequency
const STYLE={
  tag:{loose:1,agg:1,call:0,bluff:1,desc:'紧凶：标准打法'},
  lag:{loose:1.35,agg:1.35,call:-.02,bluff:1.5,desc:'松凶：爱加注、爱诈唬'},
  nit:{loose:.6,agg:.85,call:.06,bluff:.35,desc:'很紧：只玩好牌'},
  station:{loose:1.6,agg:.45,call:-.1,bluff:.25,desc:'跟注站：什么都爱跟'},
  reg:{loose:.9,agg:1,call:.02,bluff:.8,desc:'稳健常客'},
};
// share of hands a solid player opens first-in from each seat (100bb cash, 2.5bb opens)
const RFI={2:{BTN:.75},3:{BTN:.45,SB:.45},6:{UTG:.15,HJ:.2,CO:.28,BTN:.45,SB:.38}};
// seat layout in % of the table: [desktop x,y, phone x,y]
const LAYOUT={
  2:[[50,86,50,88],[50,14,50,12]],
  3:[[50,86,50,88],[18,22,20,24],[82,22,80,24]],
  6:[[50,86,50,88],[11,60,19,63],[17,18,19,26],[50,11,50,10],[83,18,81,26],[89,60,81,63]],
};

/* ---------- hand evaluation ---------- */
function straightHi(m){
  for(let r=12;r>=4;r--){const need=0b11111<<(r-4); if((m&need)===need) return r;}
  const wheel=(1<<12)|0b1111; return (m&wheel)===wheel?3:-1;
}
function enc(cat,ks){let v=cat;for(let i=0;i<5;i++) v=v*16+((ks[i]??-1)+1);return v;}
function decode(s){const ks=[];let v=s;for(let i=0;i<5;i++){ks.unshift(v%16-1);v=Math.floor(v/16);}return {cat:v,ks};}
const catOf=s=>decode(s).cat;
function evalHand(cs){
  const rc=new Array(13).fill(0),sc=[0,0,0,0],sm=[0,0,0,0];let mask=0;
  for(const c of cs){const r=c>>2,s=c&3;rc[r]++;sc[s]++;sm[s]|=1<<r;mask|=1<<r;}
  let fs=-1;for(let s=0;s<4;s++) if(sc[s]>=5) fs=s;
  if(fs>=0){const sh=straightHi(sm[fs]);if(sh>=0) return enc(8,[sh]);}
  const q=[],t=[],p=[],o=[];
  for(let r=12;r>=0;r--){if(rc[r]===4)q.push(r);else if(rc[r]===3)t.push(r);else if(rc[r]===2)p.push(r);else if(rc[r]===1)o.push(r);}
  if(q.length){const k=[...t,...p,...o].sort((a,b)=>b-a)[0];return enc(7,[q[0],k]);}
  if(t.length&&(t.length>1||p.length)){const pr=Math.max(t[1]??-1,p[0]??-1);return enc(6,[t[0],pr]);}
  if(fs>=0){const r=[];for(let x=12;x>=0&&r.length<5;x--) if(sm[fs]>>x&1) r.push(x);return enc(5,r);}
  const sh=straightHi(mask);if(sh>=0) return enc(4,[sh]);
  if(t.length){const k=[...p,...o].sort((a,b)=>b-a).slice(0,2);return enc(3,[t[0],...k]);}
  if(p.length>=2){const k=[...p.slice(2),...o].sort((a,b)=>b-a)[0];return enc(2,[p[0],p[1],k]);}
  if(p.length) return enc(1,[p[0],...o.slice(0,3)]);
  return enc(0,o.slice(0,5));
}
function scoreName(s){
  const {cat,ks}=decode(s),k=ks.map(RL);
  return [`${k[0]} 高`,`一对 ${k[0]}`,`两对 ${k[0]} 和 ${k[1]}`,`三条 ${k[0]}`,`顺子（到 ${k[0]}）`,`同花（${k[0]} 大）`,`葫芦（${k[0]} 带 ${k[1]}）`,`四条 ${k[0]}`,'同花顺'][cat];
}
function equity(hole,board,n){
  const used=new Set([...hole,...board]),deck=[];for(let c=0;c<52;c++) if(!used.has(c)) deck.push(c);
  const need=2+5-board.length;let w=0,t=0;
  for(let i=0;i<n;i++){
    for(let j=0;j<need;j++){const k=j+Math.floor(Math.random()*(deck.length-j));[deck[j],deck[k]]=[deck[k],deck[j]];}
    const b=board.concat(deck.slice(2,need));
    const a=evalHand(hole.concat(b)),o=evalHand([deck[0],deck[1]].concat(b));
    if(a>o)w++;else if(a===o)t++;
  }
  return (w+t/2)/n;
}
function drawInfo(hole,board){
  if(board.length<3||board.length>=5) return null;
  const all=hole.concat(board),made=catOf(evalHand(all));
  let flush=false;
  for(let s=0;s<4;s++){const n=all.filter(c=>(c&3)===s).length;if(n===4&&hole.some(c=>(c&3)===s)&&made<5) flush=true;}
  let m=0,bm=0;all.forEach(c=>m|=1<<(c>>2));board.forEach(c=>bm|=1<<(c>>2));
  let sr=0;if(made<4) for(let r=0;r<13;r++){if(m>>r&1) continue;if(straightHi(m|1<<r)>=0&&straightHi(bm|1<<r)<0) sr++;}
  if(!flush&&!sr) return null;
  const outs=(flush?9:0)+sr*4-(flush&&sr?sr:0);
  const names=[];if(flush) names.push('Flush draw（同花听牌）');if(sr>=2) names.push('OESD（两头顺）');else if(sr===1) names.push('Gutshot（卡顺）');
  return {text:names.join(' + '),outs};
}
var shuffle=function(a){
  const r=new Uint32Array(a.length);
  try{crypto.getRandomValues(r);}catch(e){for(let i=0;i<r.length;i++) r[i]=Math.floor(Math.random()*4294967296);}
  for(let i=a.length-1;i>0;i--){const j=r[i]%(i+1);[a[i],a[j]]=[a[j],a[i]];}
  return a;
};

/* ---------- range model ----------
   Each opponent's possible hands are weighted by how well they fit that opponent's line this hand:
   weight = eps + p^(1.25·L), p = the hand's strength percentile (preflop: 169-class table; postflop: rank on
   the current board among the samples, draws floored up), L = how much betting/raising they have done. */
let PF=null;
function pfKey(a,b){const ra=a>>2,rb=b>>2,hi=Math.max(ra,rb),lo=Math.min(ra,rb);return hi*26+lo*2+((a&3)===(b&3)&&ra!==rb?1:0);}
function pfInit(){
  PF={};const cls=[];
  for(let hi=0;hi<13;hi++)for(let lo=0;lo<=hi;lo++)for(const s of hi===lo?[0]:[0,1]){
    const a=hi*4,b=lo*4+(s?0:1)+(hi===lo?1:0);cls.push({k:pfKey(a,b),eq:equity([a,b],[],260),n:hi===lo?6:s?4:12});}
  cls.sort((x,y)=>x.eq-y.eq);let cum=0;
  for(const c of cls){PF[c.k]=(cum+c.n/2)/1326;cum+=c.n;}
}
function pfPct(h2){if(!PF) pfInit();return PF[pfKey(h2[0],h2[1])];}
function lineLevel(h,p){
  let L=0;
  for(const a of h.line[p]){
    if(a.type==='raise'){
      if(a.st===0) L+=a.n<=1?.35:a.n===2?1.1:1.8;
      else L+=(a.stab?.45:.7)+(a.stab?.4:.55)*Math.min(a.frac,2.5)+(a.isRaise?.7:0);
    }else if(a.type==='call') L+=a.st===0?(a.limp?0:.15):.25;
    else if(a.type==='check') L-=.15;
  }
  return Math.max(0,Math.min(L,4.5));
}
let RANGE_N=500;
// equity of `hole` against several opponents at once; opps=[{L,eps}]
function multiEquity(hole,board,opps,n){
  n=n||RANGE_N;const k=opps.length;
  const used=new Set([...hole,...board]),deck=[];for(let c=0;c<52;c++) if(!used.has(c)) deck.push(c);
  const need=2*k+5-board.length,sm=[];
  for(let i=0;i<n;i++){
    for(let j=0;j<need;j++){const x=j+Math.floor(Math.random()*(deck.length-j));[deck[j],deck[x]]=[deck[x],deck[j]];}
    const run=board.concat(deck.slice(2*k,need)),me=evalHand(hole.concat(run));
    const o=[];let best=me,ties=1,beaten=false;
    for(let q=0;q<k;q++){
      const h2=[deck[2*q],deck[2*q+1]],f=evalHand(h2.concat(run));
      if(f>best){beaten=true;best=f;}else if(f===best&&!beaten) ties++;
      let draw=0;if(board.length&&board.length<5){const d=drawInfo(h2,board);if(d) draw=d.outs>=8?.62:.42;}
      o.push({str:board.length?evalHand(h2.concat(board)):0,pf:board.length?0:pfPct(h2),draw});
    }
    sm.push({res:beaten?0:1/ties,o});
  }
  for(let q=0;q<k;q++){
    if(board.length){
      const idx=sm.map((_,i)=>i).sort((x,y)=>sm[x].o[q].str-sm[y].o[q].str);
      for(let i=0;i<n;){let j=i;while(j<n&&sm[idx[j]].o[q].str===sm[idx[i]].o[q].str) j++;const p=((i+j)/2)/n;for(let t=i;t<j;t++){const e=sm[idx[t]].o[q];e.p=Math.max(p,e.draw);}i=j;}
    }else sm.forEach(s=>s.o[q].p=s.o[q].pf);
  }
  let sw=0,sr=0;
  for(const s of sm){let w=1;for(let q=0;q<k;q++) w*=opps[q].eps+Math.pow(s.o[q].p,1.25*opps[q].L);sw+=w;sr+=w*s.res;}
  return sw?sr/sw:0;
}
/* what the bots have learned about you across hands */
function profRates(){
  const p=S.prof||{};
  return {fold:((p.folded||0)+4)/((p.faced||0)+10),bluff:((p.rbl||0)+1.5)/((p.rb||0)+6),agg:((p.aggs||0)+3)/((p.opps||0)+10)};
}
function saveProf(){try{localStorage.setItem('hu-holdem-prof-v1',JSON.stringify(S.prof));}catch(e){}}
// how a player at seat `me` reads opponent q's line
function readOpp(h,q){
  if(q!==0) return {L:lineLevel(h,q),eps:.02};
  const R=profRates(),aggK=Math.min(1.3,Math.max(.15,Math.pow(.3/R.agg,1.5)));
  return {L:lineLevel(h,0)*aggK,eps:Math.min(.12,Math.max(.006,.06*R.bluff*Math.max(1,R.agg/.3)))};
}

/* ---------- state ---------- */
let S=null;
const N=()=>S.mode;
const posName=(i,btn)=>MODES[S.mode].pos[(i-(btn??S.button)+S.mode)%S.mode];
const nameOf=i=>i===0?'你':S.P[i].name;
function save(){try{localStorage.setItem('holdem-v2',JSON.stringify(S.base));}catch(e){}}
function snapBase(){S.base={mode:S.mode,stacks:S.P.map(p=>p.stack),hand:S.hand,button:S.button,coach:S.coach,bought:S.bought};}
// styles are dealt out at random every time the page loads or the table changes, so a name never tells you how someone plays
function makePlayers(mode,stacks){
  const styles=shuffle(Object.keys(STYLE).slice());
  return [{name:'你',style:null,stack:stacks?.[0]??BUYIN,st:{}},...BOTS[mode].map((b,i)=>({name:b.name,style:styles[i%styles.length],stack:stacks?.[i+1]??BUYIN,st:{hands:0,vpip:0,pfr:0}}))];
}
function start(data){
  let saved=null;try{saved=JSON.parse(localStorage.getItem('holdem-v2')||'null');}catch(e){}
  const base=(data&&data.mode)?data:(saved&&saved.mode)?saved:{mode:6,hand:0,button:0,coach:true,bought:BUYIN};
  S={mode:base.mode,P:makePlayers(base.mode,base.stacks),hand:base.hand||0,button:base.button??0,coach:base.coach!==false,
     bought:base.bought||BUYIN,h:null,base:null,hist:[]};
  try{S.hist=JSON.parse(localStorage.getItem('hu-holdem-hist-v1')||'[]')||[];}catch(e){S.hist=[];}
  try{S.prof=JSON.parse(localStorage.getItem('hu-holdem-prof-v1')||'null')||{};}catch(e){S.prof={};}
  bindUI();buildSeats();renderHist();newHand();
}
function setMode(mode){
  S.mode=mode;S.P=makePlayers(mode);S.hand=0;S.button=0;S.bought=BUYIN;S.h=null;
  buildSeats();newHand();
}
function saveHist(){try{localStorage.setItem('hu-holdem-hist-v1',JSON.stringify(S.hist));}catch(e){}}
function renderHist(){
  const n=S.hist.length;
  $('#histcount').textContent=n?`已记录 ${n} 手（存在这个浏览器里，最多保留 300 手）。复制后粘贴发给 Claude 就能复盘。`:'还没有打完的牌。每打完一手会自动记下来。';
}
function exportText(n){
  const list=n?S.hist.slice(-n):S.hist;
  return `德州扑克牌谱（无限注现金桌，盲注 10/20，买入 2000），共 ${list.length} 手。括号里是当时教练栏的建议。\n\n`+
    list.map(r=>{
      const head=r.players?`【第 ${r.n} 手 · ${r.mode} 人桌】`+r.players.map(p=>`${p.name}（${p.pos}）${p.cards}`).join('｜')
        :`【第 ${r.n} 手】按钮：${r.btn}｜你：${r.you}｜Claude：${r.cl}`;
      return `${head}\n${r.log.join('\n')}\n结束筹码：${r.end}`;
    }).join('\n\n');
}
const curBet=()=>Math.max(...S.h.bet);
const potTotal=()=>S.h.pot+S.h.bet.reduce((a,b)=>a+b,0);
const canAct=i=>!S.h.folded[i]&&S.P[i].stack>0;
const live=()=>[...Array(N()).keys()].filter(i=>!S.h.folded[i]);
function log(t,cls=''){S.h.log.push({t,cls});}
function post(i,amt){amt=Math.min(amt,S.P[i].stack);S.P[i].stack-=amt;S.h.bet[i]+=amt;S.h.contrib[i]+=amt;}
function nextActor(from){for(let k=1;k<=N();k++){const i=(from+k)%N();if(canAct(i)) return i;}return -1;}

function newHand(){
  snapBase();save();
  if(S.P[0].stack<=0){S.h=null;render();return;}
  for(let i=1;i<N();i++) if(S.P[i].stack<=0){S.P[i].stack=BUYIN;S.P[i].rebuy=true;}
  S.hand++;S.button=(S.button+1)%N();
  const n=N(),d=shuffle([...Array(52).keys()]),btn=S.button;
  const sbI=n===2?btn:(btn+1)%n,bbI=n===2?(btn+1)%n:(btn+2)%n;
  const holes=[...Array(n)].map(()=>[]);
  for(let r=0;r<2;r++) for(let k=0;k<n;k++) holes[(sbI+k)%n].push(d[r*n+k]);
  const z=()=>Array(n).fill(0),f=()=>Array(n).fill(false);
  S.h={holes,runout:d.slice(2*n,2*n+5),board:[],bet:z(),contrib:z(),folded:f(),acted:f(),checked:f(),limped:f(),pot:0,street:0,
       lastRaise:BB,raises:1,limpers:[],callsSinceRaise:0,streetAgg:-1,prevAgg:-1,barrel:{p:-1,n:0},
       line:[...Array(n)].map(()=>[]),path:[],stpot:[0],act:Array(n).fill(null),log:[],over:false,runningOut:false,result:null,
       sbI,bbI,toAct:n===2?btn:(btn+3)%n};
  log(`第 ${S.hand} 手 · ${MODES[n].label}`,'st');
  for(let i=1;i<n;i++) if(S.P[i].rebuy){log(`${S.P[i].name} 补码 ${BUYIN}`);S.P[i].rebuy=false;}
  post(sbI,SB);post(bbI,BB);
  log(`${nameOf(sbI)} SB ${SB}，${nameOf(bbI)} BB ${BB}，${nameOf(btn)} 是 BTN`);
  if(!canAct(S.h.toAct)) S.h.toAct=nextActor(S.h.toAct);
  proceed();
}
/* Name an action the way players say it */
function actionName(p,type,to){
  const h=S.h,c=curBet(),toCall=c-h.bet[p],stack=S.P[p].stack;
  if(type==='fold') return {name:'Fold',k:'fold'};
  if(type==='check') return {name:'Check',k:'check'};
  if(type==='call'){
    const amt=Math.min(toCall,stack),shove=amt>=stack;
    if(h.street===0&&h.raises===1&&p!==h.bbI) return {name:'Limp',k:'call',amt,shove};
    return {name:'Call',k:'call',amt,shove};
  }
  const shove=to>=h.bet[p]+stack;
  if(c===0){
    let name='Bet';const pa=h.prevAgg;
    if(pa>=0&&pa!==p&&!h.folded[pa]&&!h.acted[pa]&&h.street>0) name='Donk bet';
    else if(pa===p){
      if(h.street===1) name='C-bet';
      else if(h.barrel.p===p&&h.barrel.n===h.street-1) name=h.street===2?'Double barrel':'Triple barrel';
    }
    if(name==='Bet'&&to>potTotal()) name='Overbet';
    return {name,k:'raise',amt:to,shove,bet:true};
  }
  let name;
  if(h.street===0){
    const lim=h.limpers.filter(i=>!h.folded[i]&&i!==p).length;
    if(h.raises===1) name=lim?'Iso-raise':'Open';
    else if(h.raises===2&&h.limped[p]) name='Limp-raise';
    else if(h.raises===2&&h.callsSinceRaise>0) name='Squeeze';
    else name=`${h.raises+1}-bet`;
  }else name=h.checked[p]?'Check-raise':(h.raises===1?'Raise':`${h.raises+1}-bet`);
  return {name,k:'raise',amt:to,shove};
}
function fmtAction(a){
  if(a.amt==null) return a.name;
  const base=a.name==='Limp'?'Limp':a.bet||a.name==='Call'?`${a.name} ${a.amt}`:`${a.name} to ${a.amt}`;
  return base+(a.shove?' (All-in)':'');
}
function roundDone(){
  const h=S.h,c=curBet(),able=[...Array(N()).keys()].filter(canAct);
  if(!able.length) return true;
  if(able.every(i=>h.acted[i]&&h.bet[i]===c)) return true;
  return able.length===1&&h.bet[able[0]]>=c&&live().length>1&&live().every(i=>i===able[0]||S.P[i].stack===0);
}
function proceed(){
  const h=S.h;
  if(live().length===1) return endByFold(live()[0]);
  if(roundDone()) return nextStreet();
  if(!canAct(h.toAct)) h.toAct=nextActor(h.toAct);
  render();maybeBot();
}
function doAction(p,type,raiseTo){
  const h=S.h;if(!h||h.over||h.toAct!==p||h.runningOut) return;
  const c=curBet(),toCall=c-h.bet[p];
  const adv=p===0?advise():null;
  if(type==='check'&&toCall>0) type='call';
  if(type==='call'&&toCall<=0) type='check';
  if(type==='raise'){raiseTo=Math.min(Math.max(raiseTo,c+1),h.bet[p]+S.P[p].stack);if(raiseTo<=c) type=toCall>0?'call':'check';}

  h.prevAgg=h.streetAgg;h.streetAgg=-1;h.raises=0;h.callsSinceRaise=0;h.stpot[h.street]=h.pot;

function finish(){

function endByFold(w){

function showdown(){

  if(h.line[0].some(a=>a.st===3&&a.type==='raise')&&!h.folded[0]){S.prof.rb=(S.prof.rb||0)+1;if(equity(h.holes[0],h.board,150)<.5) S.prof.rbl=(S.prof.rbl||0)+1;saveProf();}

  const rem=h.contrib.slice(),won={},pots=[];
  for(;;){
    const lv=[...Array(n).keys()].filter(i=>!h.folded[i]&&rem[i]>0);if(!lv.length) break;
    const m=Math.min(...lv.map(i=>rem[i]));let amt=0;
    for(let i=0;i<n;i++){const t=Math.min(rem[i],m);amt+=t;rem[i]-=t;}
    const best=Math.max(...lv.map(i=>sc[i])),win=lv.filter(i=>sc[i]===best);
    pots.push({amt,win});
  }
  const left=rem.reduce((a,b)=>a+b,0);if(left&&pots.length) pots[pots.length-1].amt+=left;
  for(const pt of pots){
    const order=[...Array(n).keys()].map(k=>(S.button+1+k)%n).filter(i=>pt.win.includes(i));
    const share=Math.floor(pt.amt/pt.win.length/10)*10;let odd=pt.amt-share*pt.win.length;
    for(const i of order){const g=share+(odd>0?odd:0);odd=0;S.P[i].stack+=g;won[i]=(won[i]||0)+g;}

  pots.forEach((pt,k)=>log(`${pots.length>1?(k===0?'主池':'边池 '+k):'底池'} ${pt.amt} → ${pt.win.map(nameOf).join('、')}${pt.win.length>1?'（平分）':''}`,'res'));

const fmtNet=()=>{const v=S.P[0].stack-S.bought;return (v>=0?'+':'')+v;};

/* ---------- bots ---------- */

function botAct(h){

}
function botDecide(h,me){

  const maxTo=h.bet[me]+stack,minTo=Math.min(maxTo,c===0?BB:c+h.lastRaise);
  const opp=live().filter(i=>i!==me),nOpp=opp.length;
  const canRaise=stack>toCall&&opp.some(i=>S.P[i].stack>0);
  const r=Math.random(),hole=h.holes[me],board=h.board;
  const vsYou=opp.includes(0),R=profRates(),bscale=vsYou?Math.min(1.6,Math.max(.4,R.fold/.4)):1;
  const to=x=>Math.max(minTo,Math.min(maxTo,r10(x)));

    const lim=h.limpers.filter(i=>!h.folded[i]).length;
    if(h.raises===1){
      if(toCall===0) return (pf>=1-.25*st.loose&&r<.85*Math.min(1,st.agg))?RAISE(BB*3+BB*lim):CHECK;
      if(!lim){
        if(pf>=thr){if(st.agg<.6&&r<.55) return CALL;return RAISE(n===2?BB*2.5:pos==='SB'?BB*3:BB*2.5);}
        if(me===h.sbI&&n>2&&st.loose>1.2&&pf>=thr-.12) return CALL;
        return FOLD;
      }
      if(pf>=1-share*.75&&r<Math.min(1,st.agg)) return RAISE(BB*3+BB*lim);
      if(pf>=thr-.04||(st.loose>1.3&&pf>=thr-.15)) return CALL;

    if(dr&&dr.outs>=8&&h.street<3&&canRaise&&!big&&nOpp===1&&r<.18*st.bluff*bscale) return RAISE(c+(pt+toCall)*.75);

/* ---------- coach ---------- */

  }

  else if(cat>0&&cat===catOf(bs)) t+='（这个牌型来自公共牌，对手也有）';

function wetBoard(board){

const coachKey=()=>`${S.hand}|${S.h.street}|${S.h.bet}|${S.h.pot}|${S.h.toAct}`;

const GRADE={good:'正确',ok:'可以',warn:'偏差',bad:'错误'};
function evaluate(a,type,to){
  const r=a.rec,ua=type,num=a.toCall>0?`你的胜率约 ${pct(a.eq)}，跟注需要 ${pct(a.need)}。`:`你的胜率约 ${pct(a.eq)}。`;
  const out=(g,label,more)=>({g,label,text:[more,num].filter(Boolean).join(' ')});
  const sizeTxt=(lo,hi)=>lo?`（建议加到 ${lo}～${hi}）`:'';
  if(ua===r.a){
    if(ua==='raise'&&r.lo){
      if(to<r.lo*.8) return out('warn','方向对，下得偏小',`尺度太小，对手跟注太便宜${sizeTxt(r.lo,r.hi)}。`);
      if(to>r.hi*1.35) return out('warn','方向对，下得偏大',`尺度太大，只有更强的牌会跟你${sizeTxt(r.lo,r.hi)}。`);
    }
    return out('good','和最佳打法一致','');
  }
  if(ua===r.alt){
    if(r.marg) return out('ok','边缘局面，这样打也说得过去',`最佳是：${a.tip}`);
    if(r.a==='raise'&&ua==='call') return out('ok','能赚钱，但加注赚得更多',`最佳是：${a.tip}`);
    if(r.a==='raise'&&ua==='check') return out('ok','可以，但更好的是主动加注',`最佳是：${a.tip}`);
  }
  const pre=a.street===0,gap=a.eq-a.need;
  if(ua==='fold'){
    if(r.a==='raise'||gap>.12) return out('bad','弃掉了能赚钱的牌',`最佳是：${a.tip}`);
    return out('warn','偏紧',`最佳是：${a.tip}`);
  }
  if(ua==='call'){
    if(pre&&a.toCall<=SB&&r.a==='raise') return out('warn','别 Limp，要玩就加注',`最佳是：${a.tip}`);
    if(r.a==='fold') return -gap>.08?out('bad','亏钱的跟注',`最佳是：${a.tip}`):out('warn','偏松',`最佳是：${a.tip}`);
    return out('warn','太被动',`最佳是：${a.tip}`);
  }
  if(ua==='check'){
    if(r.a==='raise') return out(a.eq>=.6?'bad':'warn',a.eq>=.6?'错过了价值':'可以更主动',`最佳是：${a.tip}`);
    return out('warn','和最佳打法不同',`最佳是：${a.tip}`);
  }
  // you bet or raised
  if(r.a==='fold') return out('bad',pre?'这手牌不该入池，更不该加注':'用弱牌加注，代价很大',`最佳是：${a.tip}`);
  if(r.a==='call') return out('warn','偏激进，跟注就够了',`最佳是：${a.tip}`);
  if(r.a==='check') return out(a.nOpp>1?'bad':'warn',a.nOpp>1?'多人底池里诈唬，很难成功':'偏激进，这手更适合 Check',`最佳是：${a.tip}`);

}

let anim=Promise.resolve(),animating=0;
const reduceMotion=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}};
const wait=ms=>new Promise(r=>setTimeout(r,ms));

async function flip(el,card){

    [{transform:'perspective(700px) rotateY(0deg) scale(1)'},{transform:'perspective(700px) rotateY(90deg) scale(1.06)'}],
    {duration:140,easing:'cubic-bezier(.55,0,.9,.45)',fill:'forwards'});

    [{transform:'perspective(700px) rotateY(-90deg) scale(1.06)'},{transform:'perspective(700px) rotateY(0deg) scale(1)'}],

async function dealTo(el,card,face,dur){

    const tr=tb.getBoundingClientRect(),dr=deck.getBoundingClientRect(),sr=el.getBoundingClientRect();
    const fly=document.createElement('div');fly.className='card back fly';
    const ox=tr.left+tb.clientLeft,oy=tr.top+tb.clientTop;

    tb.appendChild(fly);

      {offset:.72,transform:`translate(${dx*.95}px,${dy*.95+lift}px) rotate(4deg) scale(${sc*1.07})`,boxShadow:'0 18px 26px rgba(0,0,0,.45)',easing:'cubic-bezier(.3,0,.2,1)'},
      {offset:1,transform:`translate(${dx}px,${dy}px) rotate(0deg) scale(${sc})`,boxShadow:'0 2px 6px rgba(0,0,0,.35)'}
    ],{duration:dur||480,fill:'forwards'});

  }

async function syncCards(){
  const h=S.h,n=N(),board=$('#board').children,holes=[...Array(n).keys()].map(i=>$('#hole'+i).children);
  const all=[...holes.flatMap(x=>[...x]),...board];
  if(!h){all.forEach(clearSlot);return;}
  all.forEach(el=>{if(el.dataset.card&&!el.dataset.card.startsWith(S.hand+':')) clearSlot(el);});
  for(let i=h.board.length;i<5;i++) clearSlot(board[i]);
  // hole cards: dealt one at a time around the table starting left of the button, overlapping a little
  const jobs=[];let k=0;
  for(let r=0;r<2;r++) for(let q=0;q<n;q++){
    const i=(h.sbI+q)%n,el=holes[i][r],card=h.holes[i][r],face=i===0||h.over;
    if(el.dataset.card!==`${S.hand}:${card}`) jobs.push(wait(k++*110).then(()=>dealTo(el,card,face,380)));
  }
  await Promise.all(jobs);
  for(let i=0;i<n;i++) for(let r=0;r<2;r++){const el=holes[i][r],face=i===0||h.over;if(el.dataset.face!==String(face)) await flip(el,h.holes[i][r]);}
  for(let i=0;i<h.board.length;i++) if(board[i].dataset.card!==`${S.hand}:${h.board[i]}`) await dealTo(board[i],h.board[i],true);

    let q=[];
    if(h.street===0&&h.raises===1) q=lim?[['3BB+'+lim,60+20*lim],['4BB+'+lim,80+20*lim]]:[['2.5BB',50],['3BB',60],['4BB',80]];
    else if(h.street===0) q=[['3x',c*3+c*h.callsSinceRaise],['4x',c*4]];
    else {const base=pt+toCall;q=[['1/3 pot',c+base/3],['1/2 pot',c+base/2],['2/3 pot',c+base*2/3],['Pot',c+base]];}
    q=q.map(([nm,v])=>[nm,clamp(v)]);q.push(['All-in',maxTo]);
    const def=q[0][1];
    html+=`<div class="raisebox"><div class="quick">${q.map(([nm,v])=>`<button class="q" data-v="${v}">${nm} · ${v}</button>`).join('')}</div>
      <div class="rrow"><input type="range" id="rz" min="${minTo}" max="${maxTo}" step="10" value="${def}" aria-label="下注大小">
      <button class="btn raise" data-a="raise" id="rbtn">${fmtAction(actionName(0,'raise',def))}</button></div></div>`;
  }
  el.innerHTML=html;
  const rz=$('#rz'),rb=$('#rbtn');
  const setR=v=>{v=Math.max(minTo,Math.min(maxTo,+v));rz.value=v;rb.dataset.v=v;rb.textContent=fmtAction(actionName(0,'raise',v));};
  if(rz){setR(rz.value);rz.oninput=()=>setR(rz.value);el.querySelectorAll('.q').forEach(b=>b.onclick=()=>setR(b.dataset.v));}
  el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{el.querySelectorAll('button').forEach(x=>x.disabled=true);
    const a=b.dataset.a;doAction(0,a,a==='raise'?+rb.dataset.v:0);});
}
// after you fold: let the bots finish the hand instantly
function fastForward(){
  const h=S.h;if(!h||h.over) return;
  const saveDelay=maybeBot;let guard=0;
  maybeBot=()=>{};
  while(!h.over&&guard++<400){
    if(h.runningOut){nextStreet();continue;}
    if(h.toAct>0) botAct(h);else break;
  }
  maybeBot=saveDelay;render();
}
function bindUI(){
  chipDefs();
  $('#coachbtn').onclick=()=>{S.coach=!S.coach;snapBase();save();render();};
  const armBtn=(btn,label,armedLabel,go)=>{let armed=false,t=null;btn.onclick=()=>{
    if(!armed){armed=true;btn.textContent=armedLabel;btn.classList.add('danger');t=setTimeout(()=>{armed=false;btn.textContent=label;btn.classList.remove('danger');},3500);return;}
    clearTimeout(t);armed=false;btn.textContent=label;btn.classList.remove('danger');go();};};
  armBtn($('#resetbtn'),'重新开始','确定重来？筹码全回到 2000',()=>setMode(S.mode));
  document.querySelectorAll('#modeseg button').forEach(b=>{
    const m=+b.dataset.mode;
    armBtn(b,MODES[m].label,'切换并重开？',()=>{if(m!==S.mode) setMode(m);});
  });
  const msg=t=>{$('#histmsg').textContent=t;};
  const copy=n=>{
    if(!S.hist.length){msg('还没有牌谱可以复制。');return;}
    const txt=exportText(n),cnt=n?Math.min(n,S.hist.length):S.hist.length,ta=$('#exporttxt');
    const fallback=()=>{ta.hidden=false;ta.value=txt;ta.focus();ta.select();msg('自动复制失败了。下面的文字已全选，按 ⌘C 复制。');};
    try{navigator.clipboard.writeText(txt).then(()=>{ta.hidden=true;msg(`已复制 ${cnt} 手，粘贴发给 Claude 就行。`);},fallback);}catch(e){fallback();}
  };
  $('#coach').addEventListener('click',e=>{const b=e.target.closest('.evalbtn');if(!b||!S.h) return;S.h.evalOpen=+b.dataset.i;afterAnim();});
  $('#exp20').onclick=()=>copy(20);$('#expall').onclick=()=>copy(0);
  armBtn($('#histclear'),'清空牌谱','确定清空？',()=>{S.hist=[];saveHist();renderHist();$('#exporttxt').hidden=true;msg('牌谱已清空。');});
  document.addEventListener('keydown',e=>{
    if(!S||!S.h||e.target.tagName==='INPUT'&&e.target.type!=='range') return;
    const k=e.key.toLowerCase(),btn=s=>{const b=document.querySelector(s);if(b&&!b.disabled){e.preventDefault();b.click();}};
    if(k==='f') btn('[data-a="fold"]');else if(k==='c') btn('[data-a="call"],[data-a="check"]');else if(k==='r') btn('#rbtn');else if(k==='n'||k==='enter'&&S.h.over) btn('#next');
  });
}
window.claude?.hot?.snapshot?.(()=>S&&S.base);
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
