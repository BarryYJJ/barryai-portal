<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="无限注德州扑克现金桌：单挑、3 人、6 人可切换，盲注 10/20，带按位置的教练提示、行动路线和牌谱导出。">
<meta name="theme-color" content="#101614">
<link rel="icon" href="/texas/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/texas/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/texas/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="德州扑克">
<title>德州扑克</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: a card-room table seen from your chair; felt oval left, coach + hand log on a side rail (stacks under on phones). One deliberate dark world. */
:root{
  color-scheme: dark;
  --room:#101614; --panel:#18211e; --panel-2:#1f2a26; --line:#2c3b35;
  --felt:#21574a; --felt-deep:#153a30; --rail:#3b2519; --rail-hi:#6b4429;
  --ink:#eef1ea; --muted:#9fb1a8; --brass:#d8ab4c; --brass-ink:#1c1508;
  --card:#fbfaf5; --card-ink:#1b1d20; --card-red:#c3262d;
  --good:#7fd6a0; --warn:#f0c65a; --bad:#ef7a6e;
  --f-display:'Bricolage Grotesque','PingFang SC','Hiragino Sans GB',system-ui,sans-serif;
  --f-body:'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
  --f-num:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --cw:clamp(40px,min(10.5vw,8vh),64px);
}
html,body{background:var(--room);color:var(--ink)}
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:default}
#exporttxt{-webkit-user-select:text;user-select:text;cursor:default}
body{font-variant-emoji:text;font-family:var(--f-body);font-size:14px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 0}
button{font:inherit;color:inherit}
.app{max-width:1180px;margin:0 auto;display:grid;gap:16px;grid-template-columns:minmax(0,1fr) 330px;align-items:start}
@media (max-width:920px){.app{grid-template-columns:minmax(0,1fr)}}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:.01em;margin:0;text-wrap:balance}
.pill{font-family:var(--f-num);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-variant-numeric:tabular-nums}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--muted)}
.ghost[aria-pressed="true"]{color:var(--brass);border-color:var(--brass)}
.ghost.danger{color:var(--bad);border-color:var(--bad)}
.settle{position:fixed;inset:0;z-index:100;background:rgba(4,8,7,.66);display:flex;align-items:center;justify-content:center;padding:16px}
.sbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 22px;width:min(420px,100%);max-height:90vh;overflow:auto;box-sizing:border-box;animation:pop .22s ease-out}
.sbox h2{margin:0 0 6px;font-size:15px;color:var(--brass);letter-spacing:.08em}
.sbox h3{margin:14px 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.snet{font:800 40px/1.1 var(--f-num);font-variant-numeric:tabular-nums}.snet.up{color:var(--good)}.snet.down{color:var(--bad)}
.ssub{color:var(--muted);font-size:13px;margin:4px 0}
.sline{font-size:13.5px;margin:10px 0 0;line-height:1.7}
.smiss{background:var(--panel-2);border-radius:8px;padding:7px 10px;margin:5px 0;font-size:13px}.smiss small{display:block;color:var(--muted);margin-top:2px}
.smiss{cursor:pointer;border:1px solid transparent;transition:border-color .15s}.smiss:hover,.smiss:focus-visible{border-color:var(--brass);outline:none}
.smiss .mgo{float:right;color:var(--brass);font-size:12px;margin-left:8px}
.shint{font-weight:400;font-size:11.5px;color:var(--muted);margin-left:6px}
.settle.sub{z-index:110;background:rgba(4,8,7,.5)}
.settle.sub .sbox{width:min(460px,100%)}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.mhead h2{margin:0}
.mx{background:transparent;border:1px solid var(--line);color:var(--muted);width:30px;height:30px;border-radius:8px;font-size:18px;line-height:1;cursor:pointer;flex:none}
.mx:hover{color:var(--ink);border-color:var(--muted)}
.mrow{background:var(--panel-2);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:13px}
.mrow .mtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.mrow .mtop span:not(.vd){color:var(--muted);font-size:12px}
.mrow .mact{margin-top:3px}.mrow .mact .arr{color:var(--muted);margin:0 6px}
.mrow small{display:block;color:var(--muted);margin-top:3px;font-size:11.5px;line-height:1.5}
.sbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}.sbtns .btn{min-width:0}

/* table */
.tablecol{display:grid;gap:0;min-width:0}
.table{position:relative;background:radial-gradient(ellipse 80% 70% at 50% 45%,var(--felt) 0%,var(--felt-deep) 78%);
  border:12px solid var(--rail);border-radius:28px;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.05),inset 0 14px 50px rgba(0,0,0,.45),0 0 0 2px var(--rail-hi),0 18px 40px rgba(0,0,0,.5);
  padding:14px 18px;display:grid;gap:6px;justify-items:center;align-content:space-between}
@media (max-width:640px){.table{border-width:9px;border-radius:20px;padding:14px 8px}}
.dock{position:sticky;bottom:0;z-index:5;display:grid;gap:6px;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,var(--room) 80%,rgba(16,22,20,0))}
@media (max-height:820px){.print{display:none}}
.seat{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.seat-row{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:nowrap;height:48px}
@media (max-width:640px){
  .seat-row .pile{display:none}
  .seat-row{height:40px}
  .betzone{height:38px}
  #resultbox{height:52px}
  header{flex-wrap:nowrap;gap:8px}
  .brand{gap:8px}
  .brand h1{font-size:19px}
  .brand .bl{display:none}
  .hbtns{gap:6px;flex-wrap:nowrap}
  .hbtns .ghost{padding:5px 9px;font-size:12px;white-space:nowrap}
  .actbadge{top:calc(46px + var(--cw)*.7)}
  /* phone action bar: sizes on one scrolling row, slider, then Fold | Call | Raise side by side */
  .dock .actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px;min-height:0}
  .dock .actions .btn{min-width:0;padding:11px 4px;font-size:14px}
  .dock .actions .raisebox,.actions .rrow{display:contents}
  .dock .actions .quick{grid-column:1/-1;grid-row:1;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .dock .actions .q{flex:none;white-space:nowrap}
  .dock .actions .rrow .rzwrap{grid-column:1/-1;grid-row:2}
  .dock .actions .btn.fold{grid-row:3;grid-column:1}
  .dock .actions .btn.call{grid-row:3;grid-column:2}
  .dock .actions #rbtn{grid-row:3;grid-column:3}
  .dock .actions .waiting,.actions .next{grid-column:1/-1;justify-self:center}
}
.who{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:4px 12px 4px 6px}
.who .nm{font-family:var(--f-display);font-weight:700;font-size:15px}
.who .stk{font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums;color:var(--brass)}
.who .role{font-size:11px;color:var(--muted);letter-spacing:.04em}
.seat.turn .who{border-color:var(--brass);box-shadow:0 0 0 3px rgba(216,171,76,.18)}
.dbtn{width:22px;height:22px;border-radius:50%;background:var(--brass);color:var(--brass-ink);font:800 11px/22px var(--f-display);text-align:center;box-shadow:0 1px 0 rgba(0,0,0,.5)}
.dbtn.off{background:transparent;box-shadow:none}
.hole{display:flex;gap:6px}
.betzone{height:44px;display:flex;align-items:center;gap:8px}
#resultbox{height:60px;display:grid;place-items:center;width:100%}
.amt{font-family:var(--f-num);font-weight:700;font-size:13px;background:rgba(0,0,0,.35);border-radius:6px;padding:1px 7px;font-variant-numeric:tabular-nums}
.center{display:grid;gap:6px;justify-items:center;width:100%}
.board{display:flex;gap:6px;flex-wrap:nowrap}
.boardrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;width:100%}
.boardrow .board{grid-column:2}
.potline{grid-column:3;justify-self:start;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:72px}
.potnum{display:flex;align-items:center;gap:6px}
@media (max-width:640px){.boardrow{grid-template-columns:1fr 1fr;gap:8px 16px}.boardrow .board{grid-column:1/-1;grid-row:1;justify-self:center}.deck{grid-column:1;grid-row:2}.potline{grid-column:2;grid-row:2}}
.potline .lbl{font-size:12px;color:var(--muted);letter-spacing:.06em}
.print{font-family:var(--f-display);font-weight:700;font-size:11px;letter-spacing:.32em;color:rgba(216,171,76,.32);text-transform:uppercase;text-align:center}

/* cards */
.card{width:var(--cw);aspect-ratio:5/7;max-width:100%;background:var(--card);color:var(--card-ink);border-radius:7px;position:relative;
  box-shadow:0 2px 0 rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.35);font-family:var(--f-display)}
.card{box-sizing:border-box}
/* slots own the size; a card inside can never push the layout */
.cslot{width:var(--cw);aspect-ratio:5/7;position:relative;flex:none}
.cslot>.card{position:absolute;inset:0;width:100%;height:100%;max-width:none}
.bslot:not(.filled){border:1.5px dashed rgba(255,255,255,.16);border-radius:7px;box-sizing:border-box}
.deck{grid-column:1;justify-self:end;position:relative;width:var(--cw);aspect-ratio:5/7}
.deck .card{position:absolute;inset:0;width:100%}
.deck .card:nth-child(1){transform:translate(-4px,4px)}
.deck .card:nth-child(2){transform:translate(-2px,2px)}
.fly{position:absolute;z-index:20;transform-origin:0 0;pointer-events:none;margin:0}
.card.red{color:var(--card-red)}
.card .cr{position:absolute;top:4px;left:6px;font-weight:800;font-size:calc(var(--cw)*.31);line-height:1;letter-spacing:-.04em}
.card .cs{position:absolute;top:calc(var(--cw)*.36);left:6px;font-size:calc(var(--cw)*.22);line-height:1}
.card .cb{position:absolute;right:5px;bottom:3px;font-size:calc(var(--cw)*.55);line-height:1}
.card.back{background:repeating-linear-gradient(45deg,#7a1e19 0 5px,#932a20 5px 10px);border:3px solid #f1ebdd}
.card.back.blue{background:repeating-linear-gradient(45deg,#1d3f73 0 5px,#2a5594 5px 10px)}
.deck{transition:opacity .3s,transform .3s}
.deck.idle{opacity:.4;transform:scale(.92)}
.card.mini{--cw:34px}
.slot{width:var(--cw);aspect-ratio:5/7;border:1.5px dashed rgba(255,255,255,.16);border-radius:7px}
@keyframes deal{from{transform:translateY(-10px) scale(.96)}to{transform:none}}

/* chips */
/* chips seen at a 3/4 angle: striped edge band, oval face, value printed only on the top chip */
.pile{display:flex;align-items:flex-end;gap:3px}
.col{position:relative;width:40px;flex:none}
/* each chip = striped edge band + a vector casino-chip face squashed to 60% (so the printed value is foreshortened too) */
.chip{position:absolute;left:0;width:40px;height:28px;border-radius:20px/12px;
  background:linear-gradient(to bottom,rgba(255,255,255,.12),rgba(0,0,0,.25)),repeating-linear-gradient(90deg,var(--cc) 0 7px,var(--ce) 7px 11px);
  box-shadow:0 2px 3px rgba(0,0,0,.45)}
.chip .face{position:absolute;left:0;top:0;width:40px;height:24px;display:block}

/* action bar */
.status{text-align:center;color:var(--muted);font-size:13px;min-height:20px}
.status b{color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:98px;box-sizing:border-box}
.actions .waiting,.actions .next{align-self:center}
.btn{font-weight:700;font-size:15px;padding:12px 18px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;min-width:104px}
.btn:hover{filter:brightness(1.12)}
.btn:focus-visible,.ghost:focus-visible,.q:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn.fold{background:#3b2422;border-color:#5c352f}
.btn.call{background:#1e4c3d;border-color:#2d6b56}
.btn.raise{background:var(--brass);border-color:#ecc670;color:var(--brass-ink)}
.btn.next{background:var(--brass);color:var(--brass-ink);border-color:#ecc670;min-width:180px}
.btn:disabled{opacity:.5;cursor:default}
.raisebox{display:flex;flex-direction:column;gap:8px;flex:1 1 280px;min-width:0}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.q{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:4px 9px;font-size:12px;cursor:pointer}
.q:hover{color:var(--ink);border-color:var(--muted)}
.rrow{display:flex;gap:10px;align-items:center}
.rrow input{flex:1;min-width:0;accent-color:var(--brass)}
.rzwrap{flex:1;min-width:0;position:relative}
.rzwrap input{width:100%;margin:0;display:block}
.waiting{color:var(--muted);padding:12px;display:flex;align-items:center;gap:8px}
.dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--brass);margin:0 2px;animation:blink 1s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.25}}

/* result */
.result{background:rgba(9,18,15,.72);border:1px solid rgba(216,171,76,.4);border-radius:12px;padding:10px 14px;text-align:center;max-width:440px}
.result .big{font-family:var(--f-display);font-weight:800;font-size:18px}
.result .sub{color:var(--muted);font-size:12.5px}

/* side rail */
.rail{display:grid;gap:12px;min-width:0}
.tabs{display:none}
@media (max-width:920px){
  .tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;position:sticky;top:0;z-index:5}
  .tab{flex:1;background:transparent;border:0;border-radius:9px;padding:9px 0;font:600 14px/1 inherit;color:var(--muted);cursor:pointer}
  .rail[data-tab=coach] .tab[data-t=coach],.rail[data-tab=path] .tab[data-t=path],.rail[data-tab=review] .tab[data-t=review]{background:var(--panel-2);color:var(--ink)}
  .rail[data-tab=coach]>.box:not([data-tab=coach]),.rail[data-tab=path]>.box:not([data-tab=path]),.rail[data-tab=review]>.box:not([data-tab=review]){display:none}
}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.box h2{font-family:var(--f-display);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);margin:0 0 8px}
.coach p{margin:6px 0}
.coach .hand{font-weight:700;font-size:15px}
.coach .draw{color:var(--warn)}
.coach .tip{background:var(--panel-2);border-left:3px solid var(--brass);padding:8px 10px;border-radius:0 8px 8px 0}
.coach .why{color:var(--muted);font-size:12.5px}
.gbar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:12px 0 4px;background:#0c1311}.gbar i{display:block;height:100%}.gbar .gr{background:#c9483d}.gbar .gc{background:#2e7d62}.gbar .gf{background:#3a4a5c}
.meter{position:relative;height:10px;border-radius:5px;background:#0c1311;margin:18px 0 6px;overflow:visible}
.meter .fill{position:absolute;inset:0 auto 0 0;border-radius:5px;background:linear-gradient(90deg,#2e7d62,var(--good))}
.meter .need{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--warn)}
.meter .need span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--warn);white-space:nowrap}
.mlbl{display:flex;justify-content:space-between;font-family:var(--f-num);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.log{max-height:380px;overflow:auto;font-size:13px;display:grid;gap:10px;padding-right:4px}
.blinds{color:var(--muted);font-size:12.5px}
.sthead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sthead b{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass)}
.sthead .bd{font-family:var(--f-num);font-weight:700;color:var(--ink);letter-spacing:.02em}
.sthead .bd .r{color:#ec6f66}
.sthead .pt{font-family:var(--f-num);font-size:11.5px;color:var(--muted);margin-left:auto}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.acts .arr{color:var(--muted);font-size:12px}
.act{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:3px 8px;font-size:12.5px;white-space:nowrap}
.act .pw{font-size:11px;font-weight:700}
.act.me .pw{color:var(--brass)}
.act.cl .pw{color:#86c9d6}
.act.raise{border-color:rgba(216,171,76,.55)}
.act.fold{opacity:.6}
.pathres{color:var(--brass);font-weight:700}
.log .empty{color:var(--muted)}
.log div.res{color:var(--brass)}
.hist p{margin:0 0 8px}
.hist textarea{width:100%;box-sizing:border-box;height:160px;margin-top:8px;background:#0c1311;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px/1.5 var(--f-num);resize:vertical}
.q.danger{color:var(--bad);border-color:var(--bad)}
#seat1{position:relative}
.actbadge{position:absolute;top:calc(54px + var(--cw)*.7);left:calc(50% + var(--cw) + 18px);transform:translateY(-50%);
  white-space:nowrap;font-weight:700;font-size:14px;padding:6px 12px;border-radius:999px;
  background:rgba(8,16,13,.8);border:1px solid rgba(255,255,255,.14);color:var(--ink);animation:pop .25s ease-out}
.actbadge.raise{background:var(--brass);border-color:#ecc670;color:var(--brass-ink)}
.actbadge.call,.actbadge.check{background:#1e4c3d;border-color:#2d6b56}
.actbadge.fold{color:var(--muted)}
.actbadge.think{color:var(--muted);font-weight:500}
.actbadge.old{opacity:.5}
@keyframes pop{from{transform:translateY(-50%) scale(.8)}to{transform:translateY(-50%) scale(1)}}
@media (max-width:640px){.actbadge{font-size:12px;padding:4px 9px;left:calc(50% + var(--cw) + 10px)}}
@media (prefers-reduced-motion:reduce){.actbadge{animation:none}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}}

/* ---------- multi-seat table (2 / 3 / 6 players) ---------- */
.seg{display:flex}
.seg .ghost{border-radius:0;margin-left:-1px}
.seg .ghost:first-child{border-radius:8px 0 0 8px;margin-left:0}
.seg .ghost:last-child{border-radius:0 8px 8px 0}
.table{position:relative;display:block;padding:0;height:clamp(520px,66vh,620px);border-radius:36px}
#seats{position:absolute;inset:0}
.seat{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:5px;width:auto;z-index:2}
.seat.bot{--cw:42px}
.seat.me{--cw:clamp(50px,min(8vw,8.5vh),62px)}
.info{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:3px 11px 3px 4px;white-space:nowrap}
.info .nm{font-family:var(--f-display);font-weight:700;font-size:14px}
.info .role{font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.info .stk{font-family:var(--f-num);font-weight:700;font-size:13px;color:var(--brass);font-variant-numeric:tabular-nums}
.seat.turn .info{border-color:var(--brass);box-shadow:0 0 0 3px rgba(216,171,76,.2)}
.seat.folded .hole{opacity:.32}
.seat.folded .info{opacity:.6}
.dbtn{width:20px;height:20px;font-size:10px;line-height:20px}
.actb{height:24px;display:flex;align-items:center;justify-content:center}
.actbadge{position:static;transform:none;top:auto;left:auto;font-size:12px;padding:3px 9px;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.8)}to{transform:none}}
.betz{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;pointer-events:none;z-index:1}
.center{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:auto;--cw:clamp(40px,min(6vw,8vh),56px);z-index:1}
.boardrow{display:flex;align-items:center;gap:12px;width:auto}
.board{gap:5px}
.potrow{display:flex;align-items:center;gap:14px;min-height:52px}
.deck{position:relative;width:calc(var(--cw)*.7);aspect-ratio:5/7;justify-self:auto;flex:none}
.potline{flex-direction:row;height:34px;gap:8px}
#resultbox{height:58px;min-width:240px}
.rvl{display:grid;gap:8px;margin-bottom:8px}
.rv{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n c" "s s";gap:2px 8px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:6px}
.rvn{grid-area:n;font-weight:700;display:flex;flex-direction:column}
.rvn small{font-weight:400;color:var(--muted);font-size:11.5px}
.rvc{grid-area:c;display:flex;gap:4px}
.rvs{grid-area:s;color:var(--muted);font-size:12.5px}
.ghostbtn{background:transparent;min-width:0;font-weight:600;color:var(--muted)}
.ev{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;background:var(--panel-2)}
.evh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.evs{font-family:var(--f-display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.evt{font-weight:700}
.ev .evalbtn{margin-top:8px;color:var(--brass);border-color:rgba(216,171,76,.5)}
.ev p{margin:6px 0 0}
.vd{margin-left:auto;font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;border:1px solid currentColor}
.vd.good{color:var(--good)}.vd.ok{color:#b9c7c0}.vd.warn{color:var(--warn)}.vd.bad{color:var(--bad)}
.h2b{margin-top:14px!important}
@media (max-width:640px){
  header{flex-wrap:wrap}
  .brand .bl{display:none}
  .table{height:600px;border-radius:24px}
  .seat,.betz{left:var(--mx);top:var(--my)}
  .seat.bot{--cw:30px}
  .seat.me{--cw:48px}
  .info{padding:2px 8px 2px 3px;gap:4px}
  .info .nm{font-size:12px}
  .info .stk{font-size:11.5px}
  .info .role{font-size:9.5px}
  .betz .pile{display:none}
  .center{--cw:36px}
  .boardrow{gap:6px}
  .board{gap:4px}
  .actbadge{font-size:11px;padding:2px 7px}
  #resultbox{height:50px;min-width:0}
}

@font-face{font-family:'Silkscreen';font-weight:700;font-display:swap;src:url(/texas/fonts/silkscreen-700.woff2) format('woff2')}
#themesel{appearance:none;-webkit-appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 13px) 55%,calc(100% - 8px) 55%;background-size:5px 5px;background-repeat:no-repeat}
#themesel{background-color:transparent;cursor:pointer;margin:0;height:auto;box-sizing:content-box;line-height:1.55}
#themesel:hover{color:var(--ink);border-color:var(--muted)}
#themesel option{background:var(--panel);color:var(--ink)}
:root[data-theme=neon]{--room:#0b0618;--panel:#140a2c;--panel-2:#1d0f3d;--line:#3d2275;--felt:#160a33;--felt-deep:#160a33;--rail:#00f0ff;--rail-hi:#ff2bd6;
  --ink:#f4f0ff;--muted:#a99bd6;--brass:#ffe14d;--brass-ink:#1a0b3d;--card:#f4f0ff;--card-ink:#1a0b3d;--card-red:#ff2b6a;--good:#3dffb0;--warn:#ffe14d;--bad:#ff4d7d;
  --f-display:'Press Start 2P','PingFang SC',system-ui,sans-serif;--f-num:'Silkscreen','PingFang SC',monospace;--px-shadow:#ff2bd6;--px-edge:#1a0b3d}
:root[data-theme=vapor]{--room:#1b0b3a;--panel:#241048;--panel-2:#2e1558;--line:#5a2a80;--felt:#0f6b6b;--felt-deep:#0f6b6b;--rail:#ff3fa4;--rail-hi:#ffd23f;
  --ink:#fff6e0;--muted:#d9b8e8;--brass:#ffd23f;--brass-ink:#1b0b3a;--card:#fff6e0;--card-ink:#1b0b3a;--card-red:#e0245e;--good:#5df2d6;--warn:#ffd23f;--bad:#ff6b8b;
  --f-display:'Px Digits','Pixelify Sans','PingFang SC',system-ui,sans-serif;--f-num:'Px Digits','Pixelify Sans','PingFang SC',monospace;--px-shadow:#00d1c1;--px-edge:#1b0b3a}
:root[data-theme=tokyo]{--room:#070b14;--panel:#0c1424;--panel-2:#111d33;--line:#25355a;--felt:#0d1b2a;--felt-deep:#0d1b2a;--rail:#ff3355;--rail-hi:#ffb000;
  --ink:#e8f0ff;--muted:#8fa3c4;--brass:#ffb000;--brass-ink:#070b14;--card:#e8f0ff;--card-ink:#0d1b2a;--card-red:#ff3355;--good:#5ee6a8;--warn:#ffb000;--bad:#ff5c77;
  --f-display:'Silkscreen','PingFang SC',system-ui,sans-serif;--f-num:'Silkscreen','PingFang SC',monospace;--px-shadow:#ff3355;--px-edge:#0d1b2a}
.px *,.px *::before,.px *::after{border-radius:0!important}
.px .table{border:0;background:var(--felt);margin:12px;box-shadow:0 0 0 4px var(--rail-hi),0 0 0 8px var(--room),0 0 0 12px var(--rail)}
.px .card{box-shadow:0 0 0 2px var(--px-edge),3px 3px 0 2px var(--px-shadow)}
.card .cs svg,.card .cb svg{display:block;width:1em;height:1em}
.px .card .cs{font-size:calc(var(--cw)*.2)}
.px .card .cr{font-weight:700;font-size:calc(var(--cw)*.27);top:5px;letter-spacing:0}
.px .card.back{border:0;box-shadow:0 0 0 2px var(--rail-hi)}
.px .bslot:not(.filled),.px .slot{border:2px solid color-mix(in srgb,var(--rail-hi) 35%,transparent)}
.px .info{background:var(--room);border:2px solid var(--line)}
.px .seat.turn .info{border-color:var(--brass);box-shadow:3px 3px 0 0 var(--brass)}
.px .amt{background:var(--room);border:2px solid var(--line);font-family:var(--f-num)}
.px .btn{border-width:2px;box-shadow:4px 4px 0 0 var(--px-shadow);font-family:var(--f-display)}
.px .btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 0 var(--px-shadow)}
.px .btn.fold{background:var(--room);border-color:var(--bad);color:var(--bad)}
.px .btn.call{background:var(--room);border-color:var(--good);color:var(--good)}
.px .btn.raise,.px .btn.next{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.px .ghost,.px .q,.px .pill{border-width:2px}
.px .actions,.px .box,.px .tabs{border-width:2px}
.px .result{background:var(--room);border:2px solid var(--brass)}
.px .dbtn{font-family:var(--f-num)}
.px .brand h1{font-family:var(--f-display);font-weight:400}
.px .pxcol{display:block}
.fx{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.fx .drop{position:absolute;top:-30px;width:2px;height:14px;background:#5b7bbf88;animation:rainfall linear infinite}
@keyframes rainfall{to{transform:translateY(760px)}}
@keyframes flick{0%,90%,100%{opacity:1}91%{opacity:.5}93%{opacity:1}96%{opacity:.7}}
:root[data-theme=neon] .table,:root[data-theme=tokyo] .table{overflow:hidden}
:root[data-theme=neon] .table::after,:root[data-theme=tokyo] .table::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px)}
:root[data-theme=neon] .table{background-image:linear-gradient(#ff2bd61c 1px,transparent 1px),linear-gradient(90deg,#ff2bd61c 1px,transparent 1px);background-size:18px 18px;
  box-shadow:0 0 0 4px #ff2bd6,0 0 0 8px var(--room),0 0 0 12px #00f0ff,0 0 30px 12px #ff2bd640}
:root[data-theme=neon] .brand h1{color:#ff2bd6;text-shadow:0 0 8px #ff2bd6;font-size:17px;animation:flick 5s infinite}
:root[data-theme=neon] .info .nm{font-size:10px}
:root[data-theme=neon] .info .stk{color:#ffe14d}
:root[data-theme=neon] .card.back{background:repeating-linear-gradient(45deg,#ff2bd6 0 4px,#7a0f8a 4px 8px);box-shadow:0 0 0 2px #00f0ff}
:root[data-theme=neon] .card.back.blue{background:repeating-linear-gradient(45deg,#00f0ff 0 4px,#08506a 4px 8px);box-shadow:0 0 0 2px #ff2bd6}
:root[data-theme=neon] .card .cr{font-size:calc(var(--cw)*.22);top:6px;left:5px}
:root[data-theme=neon] .potline .amt{color:#ffe14d;text-shadow:0 0 6px #ffe14d}
:root[data-theme=vapor],:root[data-theme=vapor] body{background:linear-gradient(#1b0b3a 0 26%,#3a0f5e 26% 40%,#7a1a7a 40% 54%,#c2307a 54% 64%,#f2604f 64% 70%,#1b0b3a 70%) fixed}
:root[data-theme=vapor] body::before{content:"";position:fixed;left:50%;top:6vh;width:180px;height:180px;margin-left:-90px;border-radius:50%!important;z-index:-1;
  background:repeating-linear-gradient(#ffd23f 0 14px,#ff7a3d 14px 21px,transparent 21px 26px)}
:root[data-theme=vapor] .table{background-image:radial-gradient(#13807f 1px,transparent 1.5px);background-size:8px 8px;box-shadow:0 0 0 4px #ffd23f,0 0 0 8px #1b0b3a,8px 8px 0 8px #ff3fa4}
:root[data-theme=vapor] .card.back{background:repeating-linear-gradient(90deg,#ff3fa4 0 6px,#8a1f5e 6px 12px);box-shadow:0 0 0 2px #fff6e0}
:root[data-theme=vapor] .card.back.blue{background:repeating-linear-gradient(90deg,#00d1c1 0 6px,#0f6b6b 6px 12px)}
:root[data-theme=vapor] .dock{background:linear-gradient(to top,#1b0b3a 80%,transparent)}
:root[data-theme=tokyo] .table{background-image:linear-gradient(90deg,#ffb00012 2px,transparent 2px);background-size:26px 100%;box-shadow:0 0 0 4px #ffb000,0 0 0 8px var(--room),0 0 0 10px #ff3355}
:root[data-theme=tokyo] .brand h1{color:#ffb000;font-size:20px}
:root[data-theme=tokyo] .brand h1::after{content:" 賭場";color:#ff3355;text-shadow:0 0 6px #ff3355;font-family:'PingFang SC',sans-serif;animation:flick 6s infinite}
:root[data-theme=tokyo] .card.back{background-color:#ff3355;background-image:linear-gradient(45deg,#070b14 25%,transparent 25% 75%,#070b14 75%),linear-gradient(45deg,#070b14 25%,transparent 25% 75%,#070b14 75%);
  background-size:8px 8px;background-position:0 0,4px 4px;box-shadow:0 0 0 2px #ffb000}
:root[data-theme=tokyo] .card.back.blue{background-color:#ffb000}
@media (prefers-reduced-motion:reduce){.fx .drop{display:none}.px .brand h1,.px .brand h1::after{animation:none}}
@media (max-width:640px){.hbtns{flex-wrap:wrap!important}#themesel{padding-left:8px;padding-right:22px;background-position:calc(100% - 12px) 55%,calc(100% - 7px) 55%}.px .table{margin:8px}.px .info .nm{font-size:10px}.px .info .stk{font-size:10px}.px .info .role{font-size:8.5px}.px .info .nm,.px .info .stk,:root[data-theme=neon] .info .nm{font-family:'Px Digits','Pixelify Sans','PingFang SC',sans-serif;font-size:11px}:root[data-theme=neon] .brand h1{font-size:13px}:root[data-theme=tokyo] .brand h1{font-size:15px}}

/* ---------- five non-pixel looks: trading terminal, 1930s Shanghai deco, saloon, blueprint, comic ---------- */
@font-face{font-family:'IBM Plex Mono';font-weight:400;font-display:swap;src:url(/texas/fonts/ibm-plex-mono-400.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:700;font-display:swap;src:url(/texas/fonts/ibm-plex-mono-700.woff2) format('woff2')}
@font-face{font-family:'Poiret One';font-weight:400;font-display:swap;src:url(/texas/fonts/poiret-one.woff2) format('woff2')}
@font-face{font-family:'Limelight';font-weight:400;font-display:swap;src:url(/texas/fonts/limelight.woff2) format('woff2')}
@font-face{font-family:'Rye';font-weight:400;font-display:swap;src:url(/texas/fonts/rye.woff2) format('woff2')}
@font-face{font-family:'Architects Daughter';font-weight:400;font-display:swap;src:url(/texas/fonts/architects-daughter.woff2) format('woff2')}
@font-face{font-family:'Bangers';font-weight:400;font-display:swap;src:url(/texas/fonts/bangers.woff2) format('woff2')}
.tkbar{display:none}
:root:is([data-theme=terminal],[data-theme=terminal2]),:root[data-theme=deco],:root[data-theme=saloon],:root[data-theme=blueprint],:root[data-theme=comic]{--brass-hi:var(--brass)}
:root:is([data-theme=terminal],[data-theme=terminal2]) .dock,:root[data-theme=deco] .dock,:root[data-theme=saloon] .dock,:root[data-theme=blueprint] .dock,:root[data-theme=comic] .dock{background:linear-gradient(to top,var(--room) 80%,transparent)}

/* 交易终端 */
:root:is([data-theme=terminal],[data-theme=terminal2]){--room:#000;--panel:#0b0b0b;--panel-2:#161616;--line:#4a3410;--felt:#05070a;--felt-deep:#05070a;--rail:#ff9e1b;--rail-hi:#ff9e1b;
  --ink:#f2f2f2;--muted:#c99550;--brass:#ff9e1b;--brass-ink:#000;--card:#0a0a0a;--card-ink:#f2f2f2;--card-red:#ff3b3b;--good:#3ddc84;--warn:#ffb81c;--bad:#ff5a5a;
  --f-display:'IBM Plex Mono',ui-monospace,'PingFang SC',monospace;--f-num:'IBM Plex Mono',ui-monospace,monospace;--f-body:'IBM Plex Mono','PingFang SC',ui-monospace,monospace}
:root:is([data-theme=terminal],[data-theme=terminal2]) *{border-radius:2px}
:root:is([data-theme=terminal],[data-theme=terminal2]) .chip,:root:is([data-theme=terminal],[data-theme=terminal2]) .dbtn,:root:is([data-theme=terminal],[data-theme=terminal2]) .dots i{border-radius:50%}
:root:is([data-theme=terminal],[data-theme=terminal2]) .chip{border-radius:20px/12px}
:root:is([data-theme=terminal],[data-theme=terminal2]) .brand h1{color:#ff9e1b;font-size:21px}
:root:is([data-theme=terminal],[data-theme=terminal2]) .brand h1::after{content:" ● LIVE";font-size:11px;color:#ff3b3b;vertical-align:middle;animation:flick 3s infinite}

<body>
<div class="app">
  <header>
    <div class="brand"><h1>德州扑克</h1><span class="pill" id="handno">第 1 手</span><span class="pill" id="netpill">本场 +0</span><select class="pill" id="themesel" aria-label="风格"><option value="classic">经典</option><option value="neon">霓虹</option><option value="vapor">蒸汽波</option><option value="tokyo">新东京</option><option value="terminal">交易终端</option><option value="terminal2">交易终端2</option><option value="terminal3">交易终端3</option><option value="deco">老上海</option><option value="saloon">西部酒馆</option><option value="blueprint">工程蓝图</option><option value="comic">美漫</option><option value="bridge">星舰舰桥</option></select><span class="pill bl">盲注 10 / 20 · 买入 2000</span></div>
    <div class="hbtns">
      <div class="seg" id="modeseg" role="group" aria-label="桌型">
        <button class="ghost" data-mode="2" aria-pressed="false">单挑</button><button class="ghost" data-mode="3" aria-pressed="false">3 人</button><button class="ghost" data-mode="6" aria-pressed="false">6 人</button>
      </div>
      <button class="ghost" id="coachbtn" aria-pressed="true">教练：开</button>
      <button class="ghost" id="settlebtn">结算</button><button class="ghost" id="resetbtn">重新开始</button>
    </div>
  </header>

  <div class="tablecol">
    <div class="bbbar" id="bbbar" aria-hidden="true"></div>
    <div class="tkbar" id="tkbar" aria-hidden="true"><div class="tkmove" id="tktext"></div></div>
    <div class="table" id="table">
      <div class="fx" id="fx" aria-hidden="true"></div>
      <div id="seats"></div>
      <div class="center">
        <div class="boardrow">
          <div class="board" id="board"><div class="cslot bslot"></div><div class="cslot bslot"></div><div class="cslot bslot"></div><div class="cslot bslot"></div><div class="cslot bslot"></div></div>
        </div>
        <div class="potrow">
          <div class="deck" id="deckR" aria-label="红色牌堆"><div class="card back"></div><div class="card back"></div><div class="card back"></div></div><div class="deck" id="deckB" aria-label="蓝色牌堆"><div class="card back blue"></div><div class="card back blue"></div><div class="card back blue"></div></div>

      <div class="status" id="status"></div>

    </div>
  </div>

    <div class="tabs" role="tablist"><button class="tab" data-t="coach" role="tab">教练</button><button class="tab" data-t="path" role="tab">路线</button><button class="tab" data-t="review" role="tab">复盘</button></div>

<script>
const SB=10, BB=20, BUYIN=2000;
const RANKS='23456789TJQKA', SUITS=['♠','♥','♦','♣'];
const STREET=['Preflop','Flop','Turn','River'];
const DENOMS=[{v:500,c:'#6c45a8',e:'#eadfff',d:'#3f2470'},{v:100,c:'#25292d',e:'#e6e6e6',d:'#0b0d0f'},{v:50,c:'#d07a22',e:'#fff1dc',d:'#8a4a10'},{v:20,c:'#b3302a',e:'#ffe2de',d:'#721b17'},{v:10,c:'#2d6db3',e:'#e0edff',d:'#173f6e'},{v:5,c:'#ebe7db',e:'#6f6b60',d:'#a8a395'}];
const $=s=>document.querySelector(s);
const RL=r=>r===8?'10':RANKS[r];
const lbl=c=>RL(c>>2)+SUITS[c&3]+'\uFE0E';
const r10=x=>Math.round(x/10)*10;
const pct=x=>Math.round(x*100)+'%';

/* ---------- table formats ---------- */
// Seat 0 is always you (bottom). Action moves to seat+1 (clockwise).
const MODES={
  2:{label:'单挑',pos:['BTN','BB']},
  3:{label:'3 人',pos:['BTN','SB','BB']},
  6:{label:'6 人',pos:['BTN','SB','BB','UTG','HJ','CO']},
};
const BOTS={
  2:[{name:'Claude'}],
  3:[{name:'Claude'},{name:'Ethan'}],
  6:[{name:'Claude'},{name:'Ethan'},{name:'Oliver'},{name:'Mike'},{name:'Leo'}],
};
// loose: how wide it opens vs the baseline chart; agg: how often it bets/raises; call: extra margin it wants before calling; bluff: bluff frequency
const STYLE={
  tag:{loose:1,agg:1,call:0,bluff:1,desc:'紧凶：标准打法'},
  lag:{loose:1.35,agg:1.35,call:-.02,bluff:1.5,desc:'松凶：爱加注、爱诈唬'},
  nit:{loose:.6,agg:.85,call:.06,bluff:.35,desc:'很紧：只玩好牌'},
  station:{loose:1.6,agg:.45,call:-.1,bluff:.25,desc:'跟注站：什么都爱跟'},
  reg:{loose:.9,agg:1,call:.02,bluff:.8,desc:'稳健常客'},
};
// share of hands a solid player opens first-in from each seat (100bb cash, 2.5bb opens)
const RFI={2:{BTN:.75},3:{BTN:.45,SB:.45},6:{UTG:.15,HJ:.2,CO:.28,BTN:.45,SB:.38}};
// seat layout in % of the table: [desktop x,y, phone x,y]
const LAYOUT={
  2:[[50,86,50,88],[50,14,50,12]],
  3:[[50,86,50,88],[18,22,20,24],[82,22,80,24]],
  6:[[50,86,50,88],[11,60,19,63],[17,18,19,26],[50,11,50,10],[83,18,81,26],[89,60,81,63]],

const GTO_IDX=(()=>{const m={};let i=0;for(let hi=12;hi>=0;hi--) for(let lo=hi;lo>=0;lo--){if(hi===lo) m[hi*26+lo*2]=i++;else{m[hi*26+lo*2+1]=i++;m[hi*26+lo*2]=i++;}}return m;})();

/* The chart that covers this preflop spot for player p, or null (heads-up, limped pots, cold calls, 5-bet+).
   A 3-handed table is the same spot as a 6-max table folded round to the button, so it uses the same charts. */
function gtoSpot(h,p){
  const n=N();if(n===2||h.street!==0||h.limpers.length) return null;
  const pre=h.path.filter(a=>a.st===0);
  if(pre.some(a=>a.k==='call')) return null;
  const rs=pre.filter(a=>a.k==='raise').map(a=>a.p),P=i=>GTO_POS[posName(i)];
  let key,type;
  if(!rs.length){key=P(p)+'-open';type='open';}
  else if(rs.length===1&&rs[0]!==p){key=`${P(p)}-vs-${P(rs[0])}`;type='vsOpen';}
  else if(rs.length===2&&rs[0]===p){key=`${P(p)}-vs-${P(rs[1])}-3bet`;type='vs3bet';}
  else if(rs.length===3&&rs[1]===p&&rs[2]===rs[0]){key=`${P(p)}-vs-${P(rs[0])}-4bet`;type='vs4bet';}
  else return null;
  const raw=GTO_RAW[key];if(!raw) return null;
  const i=GTO_IDX[pfKey(h.holes[p][0],h.holes[p][1])];let r=GTO_A.indexOf(raw[2*i])*2,c=GTO_A.indexOf(raw[2*i+1])*2;
  if(r+c>100){const k=100/(r+c);r=Math.round(r*k);c=100-r;} // a few source entries add up past 100%
  const ks=key.split('-');
  const label=type==='open'?`${GTO_UP(ks[0])} 开池`:type==='vsOpen'?`${GTO_UP(ks[0])} 面对 ${GTO_UP(ks[2])} 开池`
    :type==='vs3bet'?`${GTO_UP(ks[0])} 开池后面对 ${GTO_UP(ks[2])} 的 3-bet`:`${GTO_UP(ks[0])} 3-bet 后面对 ${GTO_UP(ks[2])} 的 4-bet`;
  return {key,type,label,r,c,f:Math.max(0,100-r-c)};
}
// raise-to sizes the charts assume: open 2.5bb (SB 3bb), 3-bet 3x in position / 4x out of position, 4-bet ~2.3x, 5-bet all-in
function gtoSize(h,p,g){
  const c=curBet(),max=h.bet[p]+S.P[p].stack,pos=posName(p);
  const oop=pos==='SB'||(pos==='BB'&&g.key!=='bb-vs-sb');
  const v=g.type==='open'?(pos==='SB'?3*BB:2.5*BB):g.type==='vsOpen'?c*(oop?4:3):g.type==='vs3bet'?c*2.3:max;

/* What a player's preflop actions so far say about their hand, from the charts: a weight per 169-class

function gtoRangeOf(h,q){
  const n=N();if(n===2) return null;
  const P=i=>GTO_POS[posName(i)],raisers=[];let keys=[];
  for(const a of h.path){
    if(a.st!==0) break;
    if(a.p===q&&(a.k==='raise'||a.k==='call')){
      const k=raisers.length,kind=a.k==='raise'?0:1;let key=null;
      if(k===0&&kind===0) key=P(q)+'-open';
      else if(k===1&&raisers[0]!==q) key=`${P(q)}-vs-${P(raisers[0])}`;
      else if(k===2&&raisers[0]===q) key=`${P(q)}-vs-${P(raisers[1])}-3bet`;
      else if(k===3&&raisers[1]===q&&raisers[2]===raisers[0]) key=`${P(q)}-vs-${P(raisers[0])}-4bet`;
      if(!key||!GTO_RAW[key]) return null;
      keys.push([key,kind]);
    }
    if(a.k==='raise') raisers.push(a.p);
  }
  if(!keys.length) return null;
  return hk=>{const i=GTO_IDX[hk];let w=1;for(const [key,kind] of keys){const raw=GTO_RAW[key];w*=Math.min(100,GTO_A.indexOf(raw[2*i+kind])*2)/100;}return .015+w;};
}

function straightHi(m){
  for(let r=12;r>=4;r--){const need=0b11111<<(r-4); if((m&need)===need) return r;}
  const wheel=(1<<12)|0b1111; return (m&wheel)===wheel?3:-1;

function enc(cat,ks){let v=cat;for(let i=0;i<5;i++) v=v*16+((ks[i]??-1)+1);return v;}
function decode(s){const ks=[];let v=s;for(let i=0;i<5;i++){ks.unshift(v%16-1);v=Math.floor(v/16);}return {cat:v,ks};}

  const rc=new Array(13).fill(0),sc=[0,0,0,0],sm=[0,0,0,0];let mask=0;
  for(const c of cs){const r=c>>2,s=c&3;rc[r]++;sc[s]++;sm[s]|=1<<r;mask|=1<<r;}

  if(fs>=0){const sh=straightHi(sm[fs]);if(sh>=0) return enc(8,[sh]);}
  const q=[],t=[],p=[],o=[];
  for(let r=12;r>=0;r--){if(rc[r]===4)q.push(r);else if(rc[r]===3)t.push(r);else if(rc[r]===2)p.push(r);else if(rc[r]===1)o.push(r);}
  if(q.length){const k=[...t,...p,...o].sort((a,b)=>b-a)[0];return enc(7,[q[0],k]);}
  if(t.length&&(t.length>1||p.length)){const pr=Math.max(t[1]??-1,p[0]??-1);return enc(6,[t[0],pr]);}
  if(fs>=0){const r=[];for(let x=12;x>=0&&r.length<5;x--) if(sm[fs]>>x&1) r.push(x);return enc(5,r);}
  const sh=straightHi(mask);if(sh>=0) return enc(4,[sh]);
  if(t.length){const k=[...p,...o].sort((a,b)=>b-a).slice(0,2);return enc(3,[t[0],...k]);}
  if(p.length>=2){const k=[...p.slice(2),...o].sort((a,b)=>b-a)[0];return enc(2,[p[0],p[1],k]);}
  if(p.length) return enc(1,[p[0],...o.slice(0,3)]);

function scoreName(s){
  const {cat,ks}=decode(s),k=ks.map(RL);

function equity(hole,board,n){

  const need=2+5-board.length;let w=0,t=0;

    const b=board.concat(deck.slice(2,need));

}

  const pre=a.street===0,gap=a.eq-a.need;
  if(ua==='fold'){
    if(r.a==='raise'||gap>.12) return out('bad','弃掉了能赚钱的牌',`最佳是：${a.tip}`);
    return out('warn','偏紧',`最佳是：${a.tip}`);
  }
  if(ua==='call'){
    if(pre&&a.toCall<=SB&&r.a==='raise') return out('warn','别 Limp，要玩就加注',`最佳是：${a.tip}`);
    if(r.a==='fold') return -gap>.08?out('bad','亏钱的跟注',`最佳是：${a.tip}`):out('warn','偏松',`最佳是：${a.tip}`);
    return out('warn','太被动',`最佳是：${a.tip}`);
  }
  if(ua==='check'){
    if(r.a==='raise') return out(a.eq>=.6?'bad':'warn',a.eq>=.6?'错过了价值':'可以更主动',`最佳是：${a.tip}`);
    return out('warn','和最佳打法不同',`最佳是：${a.tip}`);
  }
  // you bet or raised
  if(r.a==='fold') return out('bad',pre?'这手牌不该入池，更不该加注':'用弱牌加注，代价很大',`最佳是：${a.tip}`);
  if(r.a==='call') return out('warn','偏激进，跟注就够了',`最佳是：${a.tip}`);
  if(r.a==='check') return out(a.nOpp>1?'bad':'warn',a.nOpp>1?'多人底池里诈唬，很难成功':'偏激进，这手更适合 Check',`最佳是：${a.tip}`);
  return out('warn','和最佳打法不同',`最佳是：${a.tip}`);
}

/* ---------- dealing animation ---------- */
let anim=Promise.resolve(),animating=0;
const reduceMotion=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function queueAnim(fn){
  animating++;
  anim=anim.then(fn).catch(()=>{}).then(()=>{animating--;if(!animating) afterAnim();});
  return anim;
}
function play(el,frames,opts){
  if(!el||!el.animate||reduceMotion()) return Promise.resolve();
  const a=el.animate(frames,opts);
  return Promise.race([a.finished,new Promise(r=>setTimeout(r,(opts.duration||300)+400))]).catch(()=>{});
}
function clearSlot(el){el.innerHTML='';delete el.dataset.card;delete el.dataset.face;el.classList.remove('filled');}
function setCard(el,card,face){el.innerHTML=cardHTML(face?card:null);el.dataset.card=`${S.hand}:${card}`;el.dataset.face=String(face);el.classList.add('filled');}
async function flip(el,card){
  if(el.firstElementChild) await play(el.firstElementChild,
    [{transform:'perspective(700px) rotateY(0deg) scale(1)'},{transform:'perspective(700px) rotateY(90deg) scale(1.06)'}],
    {duration:140,easing:'cubic-bezier(.55,0,.9,.45)',fill:'forwards'});
  setCard(el,card,true);
  await play(el.firstElementChild,
    [{transform:'perspective(700px) rotateY(-90deg) scale(1.06)'},{transform:'perspective(700px) rotateY(0deg) scale(1)'}],
    {duration:200,easing:'cubic-bezier(.2,.9,.3,1.15)'});
}
async function dealTo(el,card,face,dur){
  const tb=$('#table'),deck=$(blueHand()?'#deckB':'#deckR');
  if(el.animate&&!reduceMotion()&&deck){
    const tr=tb.getBoundingClientRect(),dr=deck.getBoundingClientRect(),sr=el.getBoundingClientRect();
    const fly=document.createElement('div');fly.className='card back fly'+(blueHand()?' blue':'');
    const ox=tr.left+tb.clientLeft,oy=tr.top+tb.clientTop;
    const s0=dr.width/sr.width;
    Object.assign(fly.style,{left:(dr.left-ox)+'px',top:(dr.top-oy)+'px',width:sr.width+'px',height:sr.height+'px'});
    tb.appendChild(fly);
    const dx=sr.left-dr.left,dy=sr.top-dr.top,sc=1,lift=-Math.min(36,12+Math.abs(dx)*.05);
    await play(fly,[
      {offset:0,transform:`translate(0,0) rotate(-14deg) scale(${s0})`,boxShadow:'0 2px 4px rgba(0,0,0,.35)',easing:'cubic-bezier(.15,.55,.35,1)'},
      {offset:.72,transform:`translate(${dx*.95}px,${dy*.95+lift}px) rotate(4deg) scale(${sc*1.07})`,boxShadow:'0 18px 26px rgba(0,0,0,.45)',easing:'cubic-bezier(.3,0,.2,1)'},
      {offset:1,transform:`translate(${dx}px,${dy}px) rotate(0deg) scale(${sc})`,boxShadow:'0 2px 6px rgba(0,0,0,.35)'}
    ],{duration:dur||480,fill:'forwards'});
    fly.remove();
  }
  setCard(el,card,false);
  if(face) await flip(el,card);
}
async function syncCards(){
  const h=S.h,n=N(),board=$('#board').children,holes=[...Array(n).keys()].map(i=>$('#hole'+i).children);
  const all=[...holes.flatMap(x=>[...x]),...board];
  const dR=$('#deckR'),dB=$('#deckB');if(dR&&dB){dR.classList.toggle('idle',blueHand());dB.classList.toggle('idle',!blueHand());}
  if(!h){all.forEach(clearSlot);return;}
  all.forEach(el=>{if(el.dataset.card&&!el.dataset.card.startsWith(S.hand+':')) clearSlot(el);});
  for(let i=h.board.length;i<5;i++) clearSlot(board[i]);
  // hole cards: dealt one at a time around the table starting left of the button, overlapping a little
  const jobs=[];let k=0;
  for(let r=0;r<2;r++) for(let q=0;q<n;q++){
    const i=(h.sbI+q)%n,el=holes[i][r],card=h.holes[i][r],face=i===0||h.over;
    if(el.dataset.card!==`${S.hand}:${card}`) jobs.push(wait(k++*110).then(()=>dealTo(el,card,face,380)));
  }
  await Promise.all(jobs);
  const bj=[];let bk=0;
  for(let i=0;i<h.board.length;i++) if(board[i].dataset.card!==`${S.hand}:${h.board[i]}`) bj.push(wait(bk++*110).then(()=>dealTo(board[i],h.board[i],true,380)));
  await Promise.all(bj);
  // showdown: every hand still face down turns over at the same moment
  const todo=[];
  for(let i=0;i<n;i++) for(let r=0;r<2;r++){const el=holes[i][r],face=i===0||h.over;if(el.dataset.face!==String(face)) todo.push([el,h.holes[i][r]]);}
  if(todo.length>2) await wait(200);
  await Promise.all(todo.map(([el,c])=>flip(el,c)));
}
let knots=[0,1];
// curved scale: small sizes get more of the track
const RZ_K=.45;
function toPos(v){const a=knots[0],b=knots[knots.length-1];return b>a?Math.round(1000*Math.pow(Math.max(0,v-a)/(b-a),RZ_K)):1000;}
function fromPos(p){const a=knots[0],b=knots[knots.length-1];return a+(b-a)*Math.pow(p/1000,1/RZ_K);}
function renderActions(){
  const h=S.h,el=$('#actions'),st=$('#status');

    el.innerHTML=`<button class="btn next" id="next">下一手 →</button>`;$('#next').onclick=newHand;$('#next').focus({preventScroll:true});return;}
  if(h.runningOut){st.textContent='All-in，直接发完公共牌';el.innerHTML=`<div class="waiting">发牌中<span class="dots"><i></i><i></i><i></i></span></div>`;return;}

    else {const base=pt+toCall;q=[['1/3 pot',c+base/3],['1/2 pot',c+base/2],['2/3 pot',c+base*2/3],['Pot',c+base]];}
    q=q.map(([nm,v])=>[nm,clamp(v)]);q.push(['All-in',maxTo]);
    const def=q[0][1];
    const tk=q.filter(x=>x[0]!=='All-in'&&x[1]>minTo&&x[1]<maxTo).filter((x,i,a)=>!i||x[1]>a[i-1][1]);
    knots=[minTo,...tk.map(x=>x[1]),maxTo];
    html+=`<div class="raisebox"><div class="quick">${q.map(([nm,v])=>`<button class="q" data-v="${v}">${nm} · ${v}</button>`).join('')}</div>
      <div class="rrow"><div class="rzwrap"><input type="range" id="rz" min="0" max="1000" step="1" value="${toPos(def)}" aria-label="下注大小"></div>
      <button class="btn raise" data-a="raise" id="rbtn">${fmtAction(actionName(0,'raise',def))}</button></div></div>`;
  }
  el.innerHTML=html;
  const rz=$('#rz'),rb=$('#rbtn');
  const setR=v=>{v=+v;v=v>=maxTo?maxTo:Math.max(minTo,Math.min(maxTo,r10(v)));if(rz) rz.value=toPos(v);rb.dataset.v=v;rb.textContent=fmtAction(actionName(0,'raise',v));};
  if(rz){setR(fromPos(+rz.value));rz.oninput=()=>setR(fromPos(+rz.value));el.querySelectorAll('.q').forEach(b=>b.onclick=()=>setR(b.dataset.v));}
  el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{el.querySelectorAll('button').forEach(x=>x.disabled=true);
    const a=b.dataset.a;doAction(0,a,a==='raise'?+rb.dataset.v:0);});
}
// after you fold: let the bots finish the hand instantly
function fastForward(){
  const h=S.h;if(!h||h.over) return;
  const saveDelay=maybeBot;let guard=0;
  maybeBot=()=>{};
  while(!h.over&&guard++<400){

/* ---------- settle: end the session in one click ---------- */
function settle(){

    h.botTok=(h.botTok||0)+1;h.roTok=(h.roTok||0)+1;h.over=true;cut=true;
    if(S.base&&S.base.stacks) S.P.forEach((p,i)=>{p.stack=S.base.stacks[i]??p.stack;});
  }
  const ss=S.sess,net=S.P[0].stack-S.bought,n=ss.hands,g=ss.g,tot=['good','ok','warn','bad'].reduce((a,k)=>a+(g[k]||0),0);
  const mins=Math.max(1,Math.round((Date.now()-ss.t)/60000)),bb100=n?(net/BB/n*100):0,buys=Math.round(S.bought/BUYIN);

  const sign=x=>(x>=0?'+':'')+x;
  const gl=['good','ok','warn','bad'].map(k=>`${GRADE[k]} ${g[k]||0}`).join(' · ');

    `打了 ${n} 手，用时约 ${mins} 分钟，买入 ${buys} 次`,
    `净 ${sign(net)}${n?`，折合每百手 ${sign(+bb100.toFixed(1))} 个大盲`:''}`,
    tot?`决策 ${tot} 次：${gl}（正确或可以 ${okRate}%）`:'这场没有记到决策',
    ...(top.length?['最常犯的错：',...top.map(([k,v],i)=>`${i+1}\\ ${k} ×${v.n}（例：${v.ex}）`)]:[]),
    ...(cut?['最后一手没打完，按那手开始前的筹码算。']:[])];

    ${tot?`<p class="sline">决策 ${tot} 次：${gl}<br>正确或可以 <b>${okRate}%</b></p>`:''}
    ${top.length?`<h3>最常犯的错 <span class="shint">点开看每一次</span></h3>${top.map(([k,v],i)=>`<div class="smiss" role="button" tabindex="0" data-i="${i}"><span class="mgo">明细 ›</span><b>${k}</b> ×${v.n}<small>${v.ex}</small></div>`).join('')}`:''}
    ${cut?'<p class="ssub">最后一手没打完，按那手开始前的筹码算。</p>':''}
    <div class="sbtns"><button class="btn ghostbtn" id="settlecopy">复制结算</button><button class="btn next" id="settleclose">好，去忙正事</button></div>
  </div>`;
  document.body.appendChild(dlg);
