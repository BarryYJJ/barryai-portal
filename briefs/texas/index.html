<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="一对一无限注德州扑克（Heads-up NLHE），盲注 10/20，带教练提示、行动路线和牌谱导出。">
<meta name="theme-color" content="#101614">
<title>德州扑克</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: a card-room table seen from your chair; felt oval left, coach + hand log on a side rail (stacks under on phones). One deliberate dark world. */
:root{
  color-scheme: dark;
  --room:#101614; --panel:#18211e; --panel-2:#1f2a26; --line:#2c3b35;
  --felt:#21574a; --felt-deep:#153a30; --rail:#3b2519; --rail-hi:#6b4429;
  --ink:#eef1ea; --muted:#9fb1a8; --brass:#d8ab4c; --brass-ink:#1c1508;
  --card:#fbfaf5; --card-ink:#1b1d20; --card-red:#c3262d;
  --good:#7fd6a0; --warn:#f0c65a; --bad:#ef7a6e;
  --f-display:'Bricolage Grotesque','PingFang SC','Hiragino Sans GB',system-ui,sans-serif;
  --f-body:'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
  --f-num:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --cw:clamp(40px,min(10.5vw,8vh),64px);
}
html,body{background:var(--room);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 0}
button{font:inherit;color:inherit}
.app{max-width:1180px;margin:0 auto;display:grid;gap:16px;grid-template-columns:minmax(0,1fr) 330px;align-items:start}
@media (max-width:920px){.app{grid-template-columns:minmax(0,1fr)}}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:.01em;margin:0;text-wrap:balance}
.pill{font-family:var(--f-num);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-variant-numeric:tabular-nums}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--muted)}
.ghost[aria-pressed="true"]{color:var(--brass);border-color:var(--brass)}
.ghost.danger{color:var(--bad);border-color:var(--bad)}

/* table */
.tablecol{display:grid;gap:0;min-width:0}
.table{position:relative;background:radial-gradient(ellipse 80% 70% at 50% 45%,var(--felt) 0%,var(--felt-deep) 78%);
  border:12px solid var(--rail);border-radius:180px/130px;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.05),inset 0 14px 50px rgba(0,0,0,.45),0 0 0 2px var(--rail-hi),0 18px 40px rgba(0,0,0,.5);
  padding:14px 18px;display:grid;gap:6px;justify-items:center;align-content:space-between}
@media (max-width:640px){.table{border-width:9px;border-radius:56px;padding:14px 8px}}
.dock{position:sticky;bottom:0;z-index:5;display:grid;gap:6px;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,var(--room) 80%,rgba(16,22,20,0))}
@media (max-height:820px){.print{display:none}}
.seat{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.seat-row{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:nowrap;height:48px}
@media (max-width:640px){
  .seat-row .pile{display:none}
  .seat-row{height:40px}
  .betzone{height:38px}
  #resultbox{height:52px}
  header{flex-wrap:nowrap;gap:8px}
  .brand{gap:8px}
  .brand h1{font-size:19px}
  .brand .bl{display:none}
  .hbtns{gap:6px;flex-wrap:nowrap}
  .hbtns .ghost{padding:5px 9px;font-size:12px;white-space:nowrap}
  .actbadge{top:calc(46px + var(--cw)*.7)}
  /* phone action bar: sizes on one scrolling row, slider, then Fold | Call | Raise side by side */
  .dock .actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px;min-height:0}
  .dock .actions .btn{min-width:0;padding:11px 4px;font-size:14px}
  .dock .actions .raisebox,.actions .rrow{display:contents}
  .dock .actions .quick{grid-column:1/-1;grid-row:1;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .dock .actions .q{flex:none;white-space:nowrap}
  .dock .actions .rrow input{grid-column:1/-1;grid-row:2}
  .dock .actions .btn.fold{grid-row:3;grid-column:1}
  .dock .actions .btn.call{grid-row:3;grid-column:2}
  .dock .actions #rbtn{grid-row:3;grid-column:3}
  .dock .actions .waiting,.actions .next{grid-column:1/-1;justify-self:center}
}
.who{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:4px 12px 4px 6px}
.who .nm{font-family:var(--f-display);font-weight:700;font-size:15px}
.who .stk{font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums;color:var(--brass)}
.who .role{font-size:11px;color:var(--muted);letter-spacing:.04em}
.seat.turn .who{border-color:var(--brass);box-shadow:0 0 0 3px rgba(216,171,76,.18)}
.dbtn{width:22px;height:22px;border-radius:50%;background:var(--brass);color:var(--brass-ink);font:800 11px/22px var(--f-display);text-align:center;box-shadow:0 1px 0 rgba(0,0,0,.5)}
.dbtn.off{background:transparent;box-shadow:none}
.hole{display:flex;gap:6px}
.betzone{height:44px;display:flex;align-items:center;gap:8px}
#resultbox{height:60px;display:grid;place-items:center;width:100%}
.amt{font-family:var(--f-num);font-weight:700;font-size:13px;background:rgba(0,0,0,.35);border-radius:6px;padding:1px 7px;font-variant-numeric:tabular-nums}
.center{display:grid;gap:6px;justify-items:center;width:100%}
.board{display:flex;gap:6px;flex-wrap:nowrap}
.boardrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;width:100%}
.boardrow .board{grid-column:2}
.potline{grid-column:3;justify-self:start;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:72px}
.potnum{display:flex;align-items:center;gap:6px}
@media (max-width:640px){.boardrow{grid-template-columns:1fr 1fr;gap:8px 16px}.boardrow .board{grid-column:1/-1;grid-row:1;justify-self:center}.deck{grid-column:1;grid-row:2}.potline{grid-column:2;grid-row:2}}
.potline .lbl{font-size:12px;color:var(--muted);letter-spacing:.06em}
.print{font-family:var(--f-display);font-weight:700;font-size:11px;letter-spacing:.32em;color:rgba(216,171,76,.32);text-transform:uppercase;text-align:center}

/* cards */
.card{width:var(--cw);aspect-ratio:5/7;max-width:100%;background:var(--card);color:var(--card-ink);border-radius:7px;position:relative;
  box-shadow:0 2px 0 rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.35);font-family:var(--f-display)}
.card{box-sizing:border-box}
/* slots own the size; a card inside can never push the layout */
.cslot{width:var(--cw);aspect-ratio:5/7;position:relative;flex:none}
.cslot>.card{position:absolute;inset:0;width:100%;height:100%;max-width:none}
.bslot:not(.filled){border:1.5px dashed rgba(255,255,255,.16);border-radius:7px;box-sizing:border-box}
.deck{grid-column:1;justify-self:end;position:relative;width:var(--cw);aspect-ratio:5/7}
.deck .card{position:absolute;inset:0;width:100%}
.deck .card:nth-child(1){transform:translate(-4px,4px)}
.deck .card:nth-child(2){transform:translate(-2px,2px)}
.fly{position:absolute;z-index:20;transform-origin:0 0;pointer-events:none;margin:0}
.card.red{color:var(--card-red)}
.card .cr{position:absolute;top:4px;left:6px;font-weight:800;font-size:calc(var(--cw)*.31);line-height:1;letter-spacing:-.04em}
.card .cs{position:absolute;top:calc(var(--cw)*.36);left:6px;font-size:calc(var(--cw)*.22);line-height:1}
.card .cb{position:absolute;right:5px;bottom:3px;font-size:calc(var(--cw)*.55);line-height:1}
.card.back{background:repeating-linear-gradient(45deg,#7a1e19 0 5px,#932a20 5px 10px);border:3px solid #f1ebdd}
.card.mini{--cw:34px}
.slot{width:var(--cw);aspect-ratio:5/7;border:1.5px dashed rgba(255,255,255,.16);border-radius:7px}
@keyframes deal{from{transform:translateY(-10px) scale(.96)}to{transform:none}}

/* chips */
/* chips seen at a 3/4 angle: striped edge band, oval face, value printed only on the top chip */
.pile{display:flex;align-items:flex-end;gap:3px}
.col{position:relative;width:40px;flex:none}
/* each chip = striped edge band + a vector casino-chip face squashed to 60% (so the printed value is foreshortened too) */
.chip{position:absolute;left:0;width:40px;height:28px;border-radius:20px/12px;
  background:linear-gradient(to bottom,rgba(255,255,255,.12),rgba(0,0,0,.25)),repeating-linear-gradient(90deg,var(--cc) 0 7px,var(--ce) 7px 11px);
  box-shadow:0 2px 3px rgba(0,0,0,.45)}
.chip .face{position:absolute;left:0;top:0;width:40px;height:24px;display:block}

/* action bar */
.status{text-align:center;color:var(--muted);font-size:13px;min-height:20px}
.status b{color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:98px;box-sizing:border-box}
.actions .waiting,.actions .next{align-self:center}
.btn{font-weight:700;font-size:15px;padding:12px 18px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;min-width:104px}
.btn:hover{filter:brightness(1.12)}
.btn:focus-visible,.ghost:focus-visible,.q:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn.fold{background:#3b2422;border-color:#5c352f}
.btn.call{background:#1e4c3d;border-color:#2d6b56}
.btn.raise{background:var(--brass);border-color:#ecc670;color:var(--brass-ink)}
.btn.next{background:var(--brass);color:var(--brass-ink);border-color:#ecc670;min-width:180px}
.btn:disabled{opacity:.5;cursor:default}
.raisebox{display:flex;flex-direction:column;gap:8px;flex:1 1 280px;min-width:0}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.q{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:4px 9px;font-size:12px;cursor:pointer}
.q:hover{color:var(--ink);border-color:var(--muted)}
.rrow{display:flex;gap:10px;align-items:center}
.rrow input{flex:1;min-width:0;accent-color:var(--brass)}
.waiting{color:var(--muted);padding:12px;display:flex;align-items:center;gap:8px}
.dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--brass);margin:0 2px;animation:blink 1s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.25}}

/* result */
.result{background:rgba(9,18,15,.72);border:1px solid rgba(216,171,76,.4);border-radius:12px;padding:10px 14px;text-align:center;max-width:440px}
.result .big{font-family:var(--f-display);font-weight:800;font-size:18px}
.result .sub{color:var(--muted);font-size:12.5px}

/* side rail */
.rail{display:grid;gap:12px;min-width:0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.box h2{font-family:var(--f-display);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);margin:0 0 8px}
.coach p{margin:6px 0}
.coach .hand{font-weight:700;font-size:15px}
.coach .draw{color:var(--warn)}
.coach .tip{background:var(--panel-2);border-left:3px solid var(--brass);padding:8px 10px;border-radius:0 8px 8px 0}
.coach .why{color:var(--muted);font-size:12.5px}
.meter{position:relative;height:10px;border-radius:5px;background:#0c1311;margin:18px 0 6px;overflow:visible}
.meter .fill{position:absolute;inset:0 auto 0 0;border-radius:5px;background:linear-gradient(90deg,#2e7d62,var(--good))}
.meter .need{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--warn)}
.meter .need span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--warn);white-space:nowrap}
.mlbl{display:flex;justify-content:space-between;font-family:var(--f-num);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.log{max-height:380px;overflow:auto;font-size:13px;display:grid;gap:10px;padding-right:4px}
.blinds{color:var(--muted);font-size:12.5px}
.sthead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sthead b{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass)}
.sthead .bd{font-family:var(--f-num);font-weight:700;color:var(--ink);letter-spacing:.02em}
.sthead .bd .r{color:#ec6f66}
.sthead .pt{font-family:var(--f-num);font-size:11.5px;color:var(--muted);margin-left:auto}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.acts .arr{color:var(--muted);font-size:12px}
.act{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:3px 8px;font-size:12.5px;white-space:nowrap}
.act .pw{font-size:11px;font-weight:700}
.act.me .pw{color:var(--brass)}
.act.cl .pw{color:#86c9d6}
.act.raise{border-color:rgba(216,171,76,.55)}
.act.fold{opacity:.6}
.pathres{color:var(--brass);font-weight:700}
.log .empty{color:var(--muted)}
.log div.res{color:var(--brass)}
.hist p{margin:0 0 8px}
.hist textarea{width:100%;box-sizing:border-box;height:160px;margin-top:8px;background:#0c1311;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px/1.5 var(--f-num);resize:vertical}
.q.danger{color:var(--bad);border-color:var(--bad)}
#seat1{position:relative}
.actbadge{position:absolute;top:calc(54px + var(--cw)*.7);left:calc(50% + var(--cw) + 18px);transform:translateY(-50%);
  white-space:nowrap;font-weight:700;font-size:14px;padding:6px 12px;border-radius:999px;
  background:rgba(8,16,13,.8);border:1px solid rgba(255,255,255,.14);color:var(--ink);animation:pop .25s ease-out}
.actbadge.raise{background:var(--brass);border-color:#ecc670;color:var(--brass-ink)}
.actbadge.call,.actbadge.check{background:#1e4c3d;border-color:#2d6b56}
.actbadge.fold{color:var(--muted)}
.actbadge.think{color:var(--muted);font-weight:500}
.actbadge.old{opacity:.5}
@keyframes pop{from{transform:translateY(-50%) scale(.8)}to{transform:translateY(-50%) scale(1)}}
@media (max-width:640px){.actbadge{font-size:12px;padding:4px 9px;left:calc(50% + var(--cw) + 10px)}}
@media (prefers-reduced-motion:reduce){.actbadge{animation:none}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}}
</style>

</head>
<body>
<div class="app">
  <header>
    <div class="brand"><h1>德州扑克</h1><span class="pill" id="handno">第 1 手</span><span class="pill bl">盲注 10 / 20 · 买入 2000</span></div>
    <div class="hbtns">
      <button class="ghost" id="coachbtn" aria-pressed="true">教练：开</button>
      <button class="ghost" id="resetbtn">重新开始</button>
    </div>
  </header>

  <div class="tablecol">
    <div class="table" id="table">
      <div class="seat" id="seat1">
        <div class="seat-row" id="info1"></div>
        <div class="hole" id="hole1"><div class="cslot"></div><div class="cslot"></div></div>
        <div id="act1" aria-live="polite"></div>
        <div class="betzone" id="bet1"></div>
      </div>
      <div class="center">
        <div class="boardrow">
          <div class="deck" id="deck" aria-label="牌堆"><div class="card back"></div><div class="card back"></div><div class="card back"></div></div>
          <div class="board" id="board"><div class="cslot bslot"></div><div class="cslot bslot"></div><div class="cslot bslot"></div><div class="cslot bslot"></div><div class="cslot bslot"></div></div>
          <div class="potline" id="pot"></div>
        </div>
        <div id="resultbox"></div>
      </div>
      <div class="seat" id="seat0">
        <div class="betzone" id="bet0"></div>
        <div class="hole" id="hole0"><div class="cslot"></div><div class="cslot"></div></div>
        <div class="seat-row" id="info0"></div>
      </div>
    </div>
    <div class="dock">
      <div class="status" id="status"></div>
      <div class="actions" id="actions"></div>
    </div>
  </div>

  <aside class="rail">
    <div class="box coach" id="coach"></div>
    <div class="box"><h2>行动路线</h2><div class="log" id="log"></div></div>
    <div class="box hist">
      <h2>牌谱</h2>
      <p class="why" id="histcount">还没有打完的牌。</p>
      <div class="quick">
        <button class="q" id="exp20">复制最近 20 手</button>
        <button class="q" id="expall">复制全部</button>
        <button class="q" id="histclear">清空牌谱</button>
      </div>
      <p class="why" id="histmsg" aria-live="polite"></p>
      <textarea id="exporttxt" hidden readonly aria-label="导出的牌谱"></textarea>
    </div>
  </aside>
</div>

<script>
const SB=10, BB=20, BUYIN=2000;
const RANKS='23456789TJQKA', SUITS=['♠','♥','♦','♣'];
const STREET=['Preflop','Flop','Turn','River'];
const DENOMS=[{v:500,c:'#6c45a8',e:'#eadfff',d:'#3f2470'},{v:100,c:'#25292d',e:'#e6e6e6',d:'#0b0d0f'},{v:50,c:'#d07a22',e:'#fff1dc',d:'#8a4a10'},{v:20,c:'#b3302a',e:'#ffe2de',d:'#721b17'},{v:10,c:'#2d6db3',e:'#e0edff',d:'#173f6e'},{v:5,c:'#ebe7db',e:'#6f6b60',d:'#a8a395'}];
const $=s=>document.querySelector(s);
const RL=r=>r===8?'10':RANKS[r];
const lbl=c=>RL(c>>2)+SUITS[c&3];
const who=p=>p===0?'你':'Claude';
const r10=x=>Math.round(x/10)*10;
const pct=x=>Math.round(x*100)+'%';

/* ---------- hand evaluation ---------- */
function straightHi(m){
  for(let r=12;r>=4;r--){const need=0b11111<<(r-4); if((m&need)===need) return r;}
  const wheel=(1<<12)|0b1111; return (m&wheel)===wheel?3:-1;
}
function enc(cat,ks){let v=cat;for(let i=0;i<5;i++) v=v*16+((ks[i]??-1)+1);return v;}
function decode(s){const ks=[];let v=s;for(let i=0;i<5;i++){ks.unshift(v%16-1);v=Math.floor(v/16);}return {cat:v,ks};}
const catOf=s=>decode(s).cat;
function evalHand(cs){
  const rc=new Array(13).fill(0),sc=[0,0,0,0],sm=[0,0,0,0];let mask=0;
  for(const c of cs){const r=c>>2,s=c&3;rc[r]++;sc[s]++;sm[s]|=1<<r;mask|=1<<r;}
  let fs=-1;for(let s=0;s<4;s++) if(sc[s]>=5) fs=s;
  if(fs>=0){const sh=straightHi(sm[fs]);if(sh>=0) return enc(8,[sh]);}
  const q=[],t=[],p=[],o=[];
  for(let r=12;r>=0;r--){if(rc[r]===4)q.push(r);else if(rc[r]===3)t.push(r);else if(rc[r]===2)p.push(r);else if(rc[r]===1)o.push(r);}
  if(q.length){const k=[...t,...p,...o].sort((a,b)=>b-a)[0];return enc(7,[q[0],k]);}
  if(t.length&&(t.length>1||p.length)){const pr=Math.max(t[1]??-1,p[0]??-1);return enc(6,[t[0],pr]);}
  if(fs>=0){const r=[];for(let x=12;x>=0&&r.length<5;x--) if(sm[fs]>>x&1) r.push(x);return enc(5,r);}
  const sh=straightHi(mask);if(sh>=0) return enc(4,[sh]);
  if(t.length){const k=[...p,...o].sort((a,b)=>b-a).slice(0,2);return enc(3,[t[0],...k]);}
  if(p.length>=2){const k=[...p.slice(2),...o].sort((a,b)=>b-a)[0];return enc(2,[p[0],p[1],k]);}
  if(p.length) return enc(1,[p[0],...o.slice(0,3)]);
  return enc(0,o.slice(0,5));
}

function saveProf(){try{localStorage.setItem('hu-holdem-prof-v1',JSON.stringify(S.prof));}catch(e){}}

const allIn=p=>S.stacks[p]===0;

/* Name an action the way players say it: Limp, Open, 3-bet, C-bet, Donk bet, Check-raise, barrels, Overbet... */
function actionName(p,type,to){
  const h=S.h,c=curBet(),toCall=c-h.bet[p],stack=S.stacks[p],o=1-p;
  if(type==='fold') return {name:'Fold',k:'fold'};
  if(type==='check') return {name:'Check',k:'check'};
  if(type==='call'){
    const amt=Math.min(toCall,stack),shove=amt>=stack;
    if(h.street===0&&h.raises===1&&p===S.button&&h.bet[p]===SB) return {name:'Limp',k:'call',amt,shove};
    return {name:'Call',k:'call',amt,shove};
  }
  const shove=to>=h.bet[p]+stack;
  if(c===0){
    let name='Bet';
    if(p!==S.button&&h.prevAgg===o) name='Donk bet';
    else if(h.prevAgg===p){
      if(h.street===1) name='C-bet';
      else if(h.barrel.p===p&&h.barrel.n===h.street-1) name=h.street===2?'Double barrel':'Triple barrel';
    }

function roundDone(){const h=S.h,c=curBet();return [0,1].every(i=>allIn(i)||(h.acted[i]&&h.bet[i]===c));}

}
function doAction(p,type,raiseTo){

function endByFold(w){

/* ---------- Claude (bot) ---------- */
function maybeBot(){const h=S.h;if(h&&!h.over&&!h.runningOut&&h.toAct===1) anim.then(()=>setTimeout(()=>botAct(h),2000+Math.random()*5000));}
function botAct(h){
  if(S.h!==h||h.over||h.toAct!==1||h.runningOut) return;
  const [t,v]=botDecide(h,1);doAction(1,t,v);

/* Decisions read the opponent's line through rangeEquity(); preflop uses hand percentiles; bluffs and

function botDecide(h,me){
  const op=1-me,c=curBet(),toCall=c-h.bet[me],stack=S.stacks[me],pt=potTotal();
  const maxTo=h.bet[me]+stack,minTo=Math.min(maxTo,c===0?BB:c+h.lastRaise);
  const canRaise=stack>toCall&&!allIn(op);
  const r=Math.random(),hole=h.holes[me],board=h.board,ip=me===S.button;
  const R=profRates(),bscale=Math.min(1.6,Math.max(.4,R.fold/.4)),aggK=Math.min(1.3,Math.max(.15,Math.pow(.3/R.agg,1.5)));
  // someone who bets all the time says less with each bet: shrink the line weight and allow more bluffs in their range
  const eps=Math.min(.12,Math.max(.006,.06*R.bluff*Math.max(1,R.agg/.3)));
  const L=lineLevel(h,op)*aggK,to=x=>Math.max(minTo,Math.min(maxTo,r10(x)));

  if(h.street===0){
    const pf=pfPct(hole);
    if(h.bet[me]===SB&&c===BB){
      if(pf>=.9&&r<.08) return ['call'];
      if(pf>=.22) return RAISE(pf>=.75&&r<.5?60:50);
      if(pf>=.12&&r<.4) return ['call'];
      return ['fold'];
    }
    if(toCall===0) return (pf>=.62&&r<.85)?RAISE(r<.5?60:80):['check'];
    const need=toCall/(pt+toCall),eq=rangeEquity(hole,[],L,RANGE_N,eps),lvl=h.raises;
    if(lvl>=4) return pf>=.975?RAISE(maxTo):(eq>=need+.04?['call']:['fold']);
    if(lvl===3){if(pf>=.95) return RAISE(c*2.3);}
    else{if(pf>=.88&&r<.85) return RAISE(c*3);if(pf>=.55&&pf<.7&&r<.1*bscale) return RAISE(c*3);}
    // facing a single open the big blind already has chips in, so defend wide; versus 3-bets and up tighten a lot
    return eq>=need+(lvl>=3?.09+(pf<.5?.04:0):.01+(pf<.3?.03:0))?['call']:['fold'];
  }
  const eq=rangeEquity(hole,board,L,RANGE_N,eps),dr=drawInfo(hole,board);
  if(toCall>0){
    const need=toCall/(pt+toCall),big=toCall>=stack*.5;
    if(eq>=.72&&canRaise&&r<.65) return RAISE(c+(pt+toCall)*.8);
    if(eq>=need+.02+(big?.04:0)) return ['call'];
    if(dr&&dr.outs>=8&&h.street<3&&canRaise&&!big&&r<.18*bscale) return RAISE(c+(pt+toCall)*.75);
    if(dr&&h.street<3&&!big&&eq>=need-.02) return ['call'];
    return ['fold'];

    if(r<b*bscale) return RAISE(pt*(h.street===3?.66:.5));
  }
  return ['check'];
}

/* ---------- coach ---------- */
function handDesc(hole,board){
  if(!board.length){
    const ra=hole[0]>>2,rb=hole[1]>>2,suited=(hole[0]&3)===(hole[1]&3),hi=Math.max(ra,rb),lo=Math.min(ra,rb);
    if(ra===rb) return `Pocket ${RL(ra)}${RL(ra)}（口袋对子）`;
    return `${RL(hi)}${RL(lo)}${suited?'s':'o'}（${suited?'同花':'杂色'}${hi-lo===1?'连张':''}）`;
  }
  const s=evalHand(hole.concat(board)),bs=evalHand(board),cat=catOf(s);
  let t=scoreName(s);
  if(board.length===5&&s===bs) t+='（五张全是公共牌，你的手牌用不上）';
  else if(cat>0&&cat===catOf(bs)) t+='（这个牌型来自公共牌，对手也有）';

}
function drawInfo(hole,board){

  let flush=false;
  for(let s=0;s<4;s++){const n=all.filter(c=>(c&3)===s).length;if(n===4&&hole.some(c=>(c&3)===s)&&made<5) flush=true;}
  let m=0,bm=0;all.forEach(c=>m|=1<<(c>>2));board.forEach(c=>bm|=1<<(c>>2));
  let sr=0;if(made<4) for(let r=0;r<13;r++){if(m>>r&1) continue;if(straightHi(m|1<<r)>=0&&straightHi(bm|1<<r)<0) sr++;}
  if(!flush&&!sr) return null;

  const names=[];if(flush) names.push('Flush draw（同花听牌）');if(sr>=2) names.push('OESD（两头顺）');else if(sr===1) names.push('Gutshot（卡顺）');
  return {text:names.join(' + '),outs};
}
let coachCache={k:'',html:''};

  const k=`${S.hand}|${h.street}|${h.bet}|${h.pot}`;if(coachCache.k===k) return coachCache.html;
  const vsLine=toCall>0||board.length>0;
  const eq=vsLine?rangeEquity(hole,board,lineLevel(h,1),900,.02):equity(hole,board,900),need=toCall>0?toCall/(pt+toCall):0;
  const dr=drawInfo(hole,board);
  let tip='',why='',shown=eq;
  if(h.street===0&&h.bet[0]===SB&&c===BB){
    if(eq>=.50){tip='Open to 50～60。';why='好牌在 BTN 要主动打：Preflop 你先说话，Flop 之后你最后说话（In position），位置占优。';}
    else if(eq>=.44){tip='Open to 50（Steal，偷盲）。';why='单挑时 BTN 能 Open 的牌很宽，常常直接拿下盲注。';}
    else if(eq>=.40){tip='边缘牌：练基本功就 Fold，想玩就 Open to 50，别 Limp。';why='Limp 等于放弃主动权，还让对手免费看 Flop。';}
    else {tip='Fold，只亏 10。';why='这种牌 Flop 之后很难打，省下的就是赚到的。';}
  }else if(h.street===0&&toCall===0){
    if(eq>=.58){tip='Raise to 60～80（Iso-raise）。';why='对手 Limp 说明牌力不强，好牌要惩罚他。';}
    else {tip='Check，免费看 Flop。';why='你在 BB，不用再加钱就能看三张牌。';}
  }else if(toCall>0){
    const adj=eq;
    const rn=actionName(0,'raise',c*3).name;
    if(adj>=.70){tip=`${rn}，把底池做大。`;why='你的牌很强，对手下注正好让你多赢一点。';}
    else if(adj>=need+.05){tip=`Call ${Math.min(toCall,S.stacks[0])}。`;why='胜率高过需要的门槛（Pot odds 够），长期跟这种注是赚的。';}
    else if(adj>=need-.04){tip=dr?'Call，靠听牌（Drawing）。':'边缘：Call 或 Fold 都行，新手阶段 Fold 更稳。';why=dr?'听牌中了就是大牌，价格还算合适。':'差一点点的 Call，长期看接近不赚不亏。';}
    else {tip='Fold。';why='胜率不够付这个价钱，及时止损。';}
  }else{
    const ip=S.button===0,bn=actionName(0,'raise',BB).name.replace('Overbet','Bet');
    if(eq>=.70){tip=`Value bet：${bn} 1/2～2/3 pot。`;why='牌强就要让对手付钱，Check 可能让他免费追牌。';}
    else if(eq>=.52){tip=`${bn} 1/3 pot，或者 Check 控池（Pot control）。`;why='中等牌力，打太大反而只会被更好的牌 Call。';}
    else if(dr&&dr.outs>=8){tip=`Semi-bluff：${bn} 1/2 pot。`;why='对手可能直接 Fold；被 Call 了你还有 outs，失败也有退路。';}
    else if(ip&&h.street<3){tip=`对手 Check 了，可以 ${bn} 1/3 pot 偷一下（Stab），被 Raise 就放手。`;why='对手 Check 说明他多半也没中，小注偷鸡成本低。';}
    else if(h.street===3){tip='River 没 outs 了：要么 Check 认输，要么 Bluff，别下中等注。';why='River 之后牌力不会再变，下注只为 Bluff 或拿价值（Value）。';}
    else {tip='Check，看对手怎么做。';why='没中又是 Out of position，先别往里投钱。';}
  }
  const needMark=toCall>0?`<div class="need" style="left:${Math.min(need*100,100)}%"><span>需要 ${pct(need)}</span></div>`:'';
  const html=`<h2>教练提示</h2>
    <p class="hand">${handDesc(hole,board)}</p>
    ${dr?`<p class="draw">${dr.text}，约 ${dr.outs} 张 outs（下一张中的概率约 ${dr.outs*2}%）</p>`:''}
    <div class="meter"><div class="fill" style="width:${Math.round(shown*100)}%"></div>${needMark}</div>
    <div class="mlbl"><span>估算胜率（Equity）${pct(shown)}</span>${toCall>0?`<span>Call ${toCall} 争 ${pt+toCall}</span>`:''}</div>
    <p class="tip"><b>建议：</b>${tip}</p>
    <p class="why">${why}${vsLine?' 胜率是按 Claude 这手的行动线估计它的牌力范围算的：它下注越多越大，范围越强。':''}</p>`;
  coachCache={k,html,tip:tip.replace(/。$/,'')};return html;
}

function pileHTML(amount,cap=7){

    return `<div class="col" title="${d.v} × ${n}" style="height:${28+(k-1)*4}px">${Array.from({length:k},(_,i)=>`<i class="chip" style="--cc:${d.c};--ce:${d.e};bottom:${i*4}px"><svg class="face" viewBox="0 0 100 100" preserveAspectRatio="none"><use href="#chip${d.v}"/></svg></i>`).join('')}</div>`;}).join('')}</div>`;
}

/* Action path: one block per street (board + pot at the start of the street), then each player's action in order. */
function pathHTML(){
  const h=S.h,sb=S.button,bb=1-sb;
  const cardTxt=c=>{const s=c&3;return `<span class="${s===1||s===2?'r':''}">${lbl(c)}</span>`;};
  let html=`<div class="blinds">第 ${S.hand} 手 · ${who(sb)} BTN/SB 10 · ${who(bb)} BB 20</div>`;
  for(let st=0;st<=h.street;st++){
    const acts=h.path.filter(a=>a.st===st);
    const board=st===0?'':h.runout.slice(0,[0,3,4,5][st]).map(cardTxt).join(' ');
    const pot=st===0?'':`<span class="pt">Pot ${h.stpot[st]??h.pot}</span>`;
    html+=`<div><div class="sthead"><b>${STREET[st]}</b>${board?`<span class="bd">${board}</span>`:''}${pot}</div>`;
    if(acts.length) html+=`<div class="acts">${acts.map(a=>`<span class="act ${a.p===0?'me':'cl'} ${a.k}"><span class="pw">${a.p===0?'你':'Claude'}</span>${a.t}</span>`).join('<span class="arr">›</span>')}</div>`;
    html+='</div>';
  }
  if(h.over){const R=h.result;
    const tail=R.type==='showdown'?`Showdown：你 ${scoreName(R.sc[0])}，Claude ${scoreName(R.sc[1])}。`:'';
    html+=`<div class="pathres">${tail}${R.winner<0?`平分底池 ${R.amount}`:`${who(R.winner)}赢下 ${R.amount}`}</div>`;}
  return html;
}

/* ---------- dealing animation ---------- */
let anim=Promise.resolve(),animating=0;
const reduceMotion=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}};
function queueAnim(fn){
  animating++;
  anim=anim.then(fn).catch(()=>{}).then(()=>{animating--;if(!animating) afterAnim();});
  return anim;
}
function play(el,frames,opts){
  if(!el.animate||reduceMotion()) return Promise.resolve();
  const a=el.animate(frames,opts);
  return Promise.race([a.finished,new Promise(r=>setTimeout(r,(opts.duration||300)+400))]).catch(()=>{});
}
function clearSlot(el){el.innerHTML='';delete el.dataset.card;delete el.dataset.face;el.classList.remove('filled');}
function setCard(el,card,face){el.innerHTML=cardHTML(face?card:null);el.dataset.card=`${S.hand}:${card}`;el.dataset.face=String(face);el.classList.add('filled');}
async function flip(el,card){
  if(el.firstElementChild) await play(el.firstElementChild,
    [{transform:'perspective(700px) rotateY(0deg) scale(1)'},{transform:'perspective(700px) rotateY(90deg) scale(1.06)'}],
    {duration:150,easing:'cubic-bezier(.55,0,.9,.45)',fill:'forwards'});
  setCard(el,card,true);
  await play(el.firstElementChild,
    [{transform:'perspective(700px) rotateY(-90deg) scale(1.06)'},{transform:'perspective(700px) rotateY(0deg) scale(1)'}],
    {duration:220,easing:'cubic-bezier(.2,.9,.3,1.15)'});
}
async function dealTo(el,card,face){
  const tb=$('#table'),deck=$('#deck');
  if(el.animate&&!reduceMotion()){
    const tr=tb.getBoundingClientRect(),dr=deck.getBoundingClientRect(),sr=el.getBoundingClientRect();
    const fly=document.createElement('div');fly.className='card back fly';
    const ox=tr.left+tb.clientLeft,oy=tr.top+tb.clientTop;
    Object.assign(fly.style,{left:(dr.left-ox)+'px',top:(dr.top-oy)+'px',width:dr.width+'px',height:dr.height+'px'});
    tb.appendChild(fly);
    // a flick off the deck: quick launch, slight lift and spin mid-air, then a soft decelerating landing
    const dx=sr.left-dr.left,dy=sr.top-dr.top,sc=sr.width/dr.width,lift=-Math.min(36,12+Math.abs(dx)*.06);
    await play(fly,[
      {offset:0,transform:'translate(0,0) rotate(-14deg) scale(1)',boxShadow:'0 2px 4px rgba(0,0,0,.35)',easing:'cubic-bezier(.15,.55,.35,1)'},
      {offset:.72,transform:`translate(${dx*.95}px,${dy*.95+lift}px) rotate(4deg) scale(${sc*1.07})`,boxShadow:'0 18px 26px rgba(0,0,0,.45)',easing:'cubic-bezier(.3,0,.2,1)'},
      {offset:1,transform:`translate(${dx}px,${dy}px) rotate(0deg) scale(${sc})`,boxShadow:'0 2px 6px rgba(0,0,0,.35)'}
    ],{duration:520,fill:'forwards'});
    fly.remove();
  }
  setCard(el,card,false);
  if(face) await flip(el,card);
}
async function syncCards(){
  const h=S.h,holes=[$('#hole0').children,$('#hole1').children],board=$('#board').children;
  const all=[...holes[0],...holes[1],...board];
  if(!h){all.forEach(clearSlot);return;}
  all.forEach(el=>{if(el.dataset.card&&!el.dataset.card.startsWith(S.hand+':')) clearSlot(el);});
  for(let i=h.board.length;i<5;i++) clearSlot(board[i]);
  const jobs=[],bb=1-S.button,sb=S.button;
  for(const i of [0,1]) for(const p of [bb,sb]) jobs.push([holes[p][i],h.holes[p][i],p===0||h.over]);
  h.board.forEach((c,i)=>jobs.push([board[i],c,true]));
  for(const [el,card,face] of jobs){
    const key=`${S.hand}:${card}`;
    if(el.dataset.card!==key) await dealTo(el,card,face);
    else if(el.dataset.face!==String(face)) await flip(el,card);
  }
}
function renderActions(){
  const h=S.h,el=$('#actions'),st=$('#status');
  if(h.over){st.innerHTML=`你 <b>${S.stacks[0]}</b> · Claude <b>${S.stacks[1]}</b>`;
    el.innerHTML=`<button class="btn next" id="next">下一手 →</button>`;$('#next').onclick=newHand;$('#next').focus({preventScroll:true});return;}
  if(h.runningOut){st.textContent='All-in，直接发完公共牌';el.innerHTML=`<div class="waiting">发牌中<span class="dots"><i></i><i></i><i></i></span></div>`;return;}
  if(h.toAct!==0){st.innerHTML=`总底池 <b>${potTotal()}</b>`;el.innerHTML=`<div class="waiting">Claude 出牌中<span class="dots"><i></i><i></i><i></i></span></div>`;return;}
  const c=curBet(),toCall=c-h.bet[0],stack=S.stacks[0],maxTo=h.bet[0]+stack;
  const minTo=Math.min(maxTo,c===0?BB:c+h.lastRaise),canRaise=stack>toCall&&!allIn(1),pt=potTotal();

  let html='';
  if(toCall>0) html+=`<button class="btn fold" data-a="fold">Fold</button>`;

  if(canRaise){

    let q=[];
    if(h.street===0&&c===BB) q=[['2.5x',50],['3x',60],['4x',80]];
    else if(h.street===0) q=[['3x',c*3],['4x',c*4]];
    else {const base=pt+toCall;q=[['1/3 pot',c+base/3],['1/2 pot',c+base/2],['Pot',c+base]];}
    q=q.map(([n,v])=>[n,clamp(v)]);q.push(['All-in',maxTo]);

      <div class="rrow"><input type="range" id="rz" min="${minTo}" max="${maxTo}" step="10" value="${def}" aria-label="下注大小">
      <button class="btn raise" data-a="raise" id="rbtn">${fmtAction(actionName(0,'raise',def))}</button></div></div>`;
  }
  el.innerHTML=html;
  const rz=$('#rz'),rb=$('#rbtn');
  const setR=v=>{v=Math.max(minTo,Math.min(maxTo,+v));rz.value=v;rb.dataset.v=v;rb.textContent=fmtAction(actionName(0,'raise',v));};
  if(rz){setR(rz.value);rz.oninput=()=>setR(rz.value);el.querySelectorAll('.q').forEach(b=>b.onclick=()=>setR(b.dataset.v));}
  el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{el.querySelectorAll('button').forEach(x=>x.disabled=true);
    const a=b.dataset.a;doAction(0,a,a==='raise'?+rb.dataset.v:0);});
}
