<!DOCTYPE html>

<head>

<title>今天在涨什么 · BarryYJJ AI 简报</title>
<meta name="description" content="今天在涨什么：每日 AI 卖方研报简报归档，早间 / 午间 / 晚间 / 深夜四档，可按日期回看。">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#1B34E8">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20fill='%231B34E8'/%3E%3Crect%20x='16'%20y='16'%20width='32'%20height='32'%20fill='none'%20stroke='%23fff'%20stroke-width='4'/%3E%3Crect%20x='28'%20y='28'%20width='8'%20height='8'%20fill='%23fff'/%3E%3C/svg%3E">
<link rel="canonical" href="https://barryai.cn/briefs/viewer.html">

<link rel="stylesheet" href="/briefs/css/viewer-notion.css?v=202608311905">
</head>
<body class="briefs-viewer-page">
<a class="vw-skip" href="#main">跳到简报内容</a>

<!-- 1. 顶栏：返回 barryai.cn 首页（../ 从 /briefs/viewer.html 解析到站点根 /） -->
<header class="vw-topbar vw-on-blue">
  <div class="vw-wrap vw-topbar-in">
    <a class="barry-rs-home" href="https://barryai.cn/" aria-label="返回 Barry RS 首页" title="返回 Barry RS 首页"><span class="brs-top" aria-hidden="true">BARRY</span><span class="brs-bot" aria-hidden="true">RS</span></a>
    <p class="vw-brand">from BarryYJJ &nbsp;|&nbsp; 🌋 Token燃烧</p>
  </div>
</header>

<main id="main">

  <!-- 2. 蓝图网格 hero -->
  <section class="vw-hero vw-on-blue" aria-labelledby="hero-title">
    <div class="vw-wrap">
      <p class="vw-eyebrow">/briefs/daily-signals</p>
      <h1 id="hero-title">今天在涨什么</h1>
      <p class="vw-sub">每日 AI 卖方研报简报归档。早间、午间、晚间、深夜四档当班信号，覆盖 A 股、港股与美股科技资产，按日期回看历史存档。</p>
    </div>
  </section>

  <!-- 3. 白底控制台：日期选择 + 四档班次 -->
  <section class="vw-panel" aria-labelledby="panel-title">
    <div class="vw-wrap vw-panel-in">
      <div class="vw-sec-head">
        <h2 id="panel-title">简报选择 · console</h2>
        <p class="vw-readout" id="title-date" aria-live="polite">今日 AI 简报</p>
      </div>
      <div class="brief-controls">
        <div class="vw-field">
          <label for="date-pick">日期 / date</label>
          <select id="date-pick" class="ctrl-input"></select>
        </div>
        <div class="period-toggle" role="group" aria-label="选择班次">
          <button type="button" data-period="morning" class="period-btn active">早间</button>
          <button type="button" data-period="noon" class="period-btn">午间</button>
          <button type="button" data-period="evening" class="period-btn">晚间</button>
          <button type="button" data-period="night" class="period-btn">深夜</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 4. 内容台面 -->
  <section class="vw-stage" aria-labelledby="stage-title">
    <div class="vw-wrap">
      <h2 class="vw-sr-only" id="stage-title">简报正文</h2>

      <div id="empty-state" class="empty-state" hidden>
        <p>所选日期暂无简报。</p>
      </div>

      <div id="brief-wrap" class="brief-wrap">
        <div class="vw-stage-bar">
          <span>brief · document</span>
          <span class="vw-ticks" aria-hidden="true"><i></i><i></i><i></i></span>
        </div>
        <iframe id="brief-frame" title="简报内容" loading="eager"></iframe>
      </div>
    </div>
  </section>

</main>

<footer class="vw-foot">
  <div class="vw-wrap vw-foot-in">
    <p>Barry RS · 今天在涨什么</p>
    <p class="vw-dim">barryai.cn/briefs</p>
  </div>
</footer>

<script src="/briefs/js/cb-v2.js"></script>
<script src="/briefs/js/viewer.js?v=202608311905"></script>
</body>
</html>
