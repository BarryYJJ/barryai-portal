<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BarryYJJ AI 简报 · 阅读</title>
<link rel="stylesheet" href="./css/main.css">
</head>
<body>
<div class="page-frame viewer">
  <div class="corner-meta">
    <div class="brand">from BarryYJJ &nbsp;|&nbsp; 🌋 Token燃烧</div>
  </div>

  <header class="viewer-header">
    <h1><span class="title-prefix">今天在涨什么：</span><span id="title-date">今日 AI 简报</span></h1>
    <div class="brief-controls">
      <label for="date-pick">日期</label>
      <select id="date-pick" class="ctrl-input"></select>
      <div class="period-toggle">
        <button data-period="morning" class="period-btn active">早间</button>
        <button data-period="noon" class="period-btn">午间</button>
        <button data-period="evening" class="period-btn">晚间</button>
        <button data-period="night" class="period-btn">深夜</button>
      </div>
    </div>
  </header>

  <div id="empty-state" class="empty-state" hidden>
    <p>所选日期暂无简报。</p>
  </div>

  <div id="brief-wrap" class="brief-wrap">
    <iframe id="brief-frame" title="简报内容" loading="eager"></iframe>
  </div>
</div>

<script src="./js/cb-v2.js"></script>
<script src="./js/viewer.js?v=20260625b"></script>
</body>
</html>
