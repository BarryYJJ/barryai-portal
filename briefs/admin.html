<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BarryYJJ AI 简报 · 访问后台</title>
<link rel="stylesheet" href="./css/main.css">
</head>
<body class="admin-page">
<div class="page-frame admin">
  <div class="corner-meta">
    <div class="brand">from BarryYJJ &nbsp;|&nbsp; 🌋 Token燃烧</div>
    <div>访问者列表</div>
  </div>

  <header class="admin-topbar">
    <p class="admin-kicker">/admin/visitors</p>
    <h1 class="admin-title">访问后台</h1>
    <p class="admin-desc">「今天在涨什么」访问者名单与近 7 天访问明细，仅供内部核对。</p>
  </header>

  <main class="admin-main">
    <section class="admin-stats" id="stats" aria-label="统计概览">
      <div class="stat-tile">
        <span class="stat-label">总提交</span>
        <strong class="stat-value" id="stat-total">—</strong>
      </div>
      <div class="stat-tile">
        <span class="stat-label">今日新增</span>
        <strong class="stat-value" id="stat-today">—</strong>
      </div>
      <div class="stat-tile">
        <span class="stat-label">本周新增</span>
        <strong class="stat-value" id="stat-week">—</strong>
      </div>
      <div class="stat-tile stat-tile-accent">
        <span class="stat-label">本周访问总次数</span>
        <strong class="stat-value" id="stat-visits-week">—</strong>
      </div>
    </section>

    <section class="admin-toolbar" aria-label="操作">
      <div class="admin-search">
        <label for="search" class="sr-only">搜索姓名、机构或联系方式</label>
        <input type="text" id="search" class="admin-search-input" placeholder="搜姓名 / 机构 / 联系方式" autocomplete="off">
      </div>
      <button type="button" id="refresh-btn" class="admin-refresh-btn">刷新</button>
    </section>

    <div id="auth-prompt" class="auth-prompt" hidden>
      <p class="auth-prompt-code">access denied</p>
      <h3>需要后台 key</h3>
      <p>URL 缺少 <code>?key=</code> 参数，访问被拒绝。</p>
    </div>

    <div id="loading" class="loading-state">加载中…</div>

    <p class="admin-scroll-hint" id="table-scroll-hint">左右滑动查看完整字段&nbsp; →</p>
    <section class="admin-table-wrap" aria-describedby="table-scroll-hint">
      <table id="visitors-table" class="visitors-table" hidden>
        <thead>
          <tr>
            <th>时间</th>
            <th>姓名</th>
            <th>机构</th>
            <th>联系方式</th>
            <th>留言</th>
            <th>IP</th>
            <th>本周访问</th>
          </tr>
        </thead>
        <tbody id="visitors-body"></tbody>
      </table>
    </section>
  </main>
</div>

<script src="./js/cb-v2.js"></script>
<script src="./js/admin.js"></script>
</body>
</html>
