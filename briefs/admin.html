<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BarryYJJ AI 简报 · 访问后台</title>
<link rel="stylesheet" href="./css/main.css?v=202609101200">
</head>
<body class="admin-page">
<div class="page-frame admin">
  <a class="barry-rs-home" href="https://barryai.cn/" aria-label="返回 Barry RS 首页" title="返回 Barry RS 首页"><span class="brs-top" aria-hidden="true">BARRY</span><span class="brs-bot" aria-hidden="true">RS</span></a>
  <div class="corner-meta">
    <div class="brand">from BarryYJJ &nbsp;|&nbsp; 🌋 Token燃烧</div>
    <div>访问者列表</div>
  </div>

  <header class="admin-topbar">
    <p class="admin-kicker">/admin/visitors</p>
    <h1 class="admin-title">访问后台</h1>
    <p class="admin-desc">三个产品（今天在涨啥 / OpenRouter 看板 / Token &amp; GPU 看板）共用的线索名单与近 30 天访问统计，仅供内部核对。</p>
  </header>

  <main class="admin-main">
    <section class="admin-stats" id="stats" aria-label="统计概览">
      <div class="stat-tile">
        <span class="stat-label">总线索</span>
        <strong class="stat-value" id="stat-total">—</strong>
      </div>
      <div class="stat-tile">
        <span class="stat-label">今日访客</span>
        <strong class="stat-value" id="stat-today">—</strong>
      </div>
      <div class="stat-tile">
        <span class="stat-label">7 日访问</span>
        <strong class="stat-value" id="stat-week">—</strong>
      </div>
      <div class="stat-tile stat-tile-accent">
        <span class="stat-label">30 日访问</span>
        <strong class="stat-value" id="stat-visits-week">—</strong>
      </div>
    </section>

    <section class="admin-products" id="product-stats" aria-label="各产品统计" hidden></section>
    <p class="admin-warnings" id="admin-warnings" role="status" hidden></p>

    <section class="admin-toolbar" aria-label="操作">
      <div class="admin-search">
        <label for="search" class="sr-only">搜索姓名、机构或联系方式</label>
        <input type="text" id="search" class="admin-search-input" placeholder="搜姓名 / 机构 / 联系方式" autocomplete="off">
      </div>
      <label for="product-filter" class="sr-only">按产品筛选</label>
      <select id="product-filter" class="admin-product-filter">
        <option value="">全部产品</option>
        <option value="briefs">今天在涨啥</option>
        <option value="openrouter">OpenRouter 看板</option>
        <option value="token-gpu">Token &amp; GPU 看板</option>
      </select>
      <button type="button" id="refresh-btn" class="admin-refresh-btn">刷新</button>
    </section>

    <div id="auth-prompt" class="auth-prompt" hidden>
      <p class="auth-prompt-code">access denied</p>
      <h3>需要后台 key</h3>
      <p>URL 缺少 <code>?key=</code> 参数，访问被拒绝。</p>
    </div>

    <div id="loading" class="loading-state">加载中…</div>

    <p class="admin-scroll-hint" id="table-scroll-hint">左右滑动查看完整字段&nbsp; →</p>
    <section class="admin-table-wrap" aria-describedby="table-scroll-hint">
      <table id="visitors-table" class="visitors-table" hidden>
        <thead>
          <tr>
            <th>提交时间</th>
            <th>姓名</th>
            <th>机构</th>
            <th>联系方式</th>
            <th>首次产品</th>
            <th>留言</th>
            <th>IP</th>
            <th>30 日内首次访问</th>
            <th>最近访问</th>
            <th>30 日访问</th>
          </tr>
        </thead>
        <tbody id="visitors-body"></tbody>
      </table>
    </section>
  </main>
</div>

<script src="./js/cb-v2.js"></script>
<script src="./js/barry-access.js?v=202609101200"></script>
<script src="./js/admin.js?v=202609101200"></script>
</body>
</html>
