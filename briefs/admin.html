<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BarryYJJ AI 简报 · 访问后台</title>
<link rel="stylesheet" href="./css/main.css">
</head>
<body>
<div class="page-frame admin">
  <div class="corner-meta">
    <div class="brand">from BarryYJJ &nbsp;|&nbsp; 🌋 Token燃烧</div>
    <div>访问者列表</div>
  </div>

  <header class="admin-header">
    <h1>访问后台</h1>
    <div class="admin-stats" id="stats">
      <span class="stat-pill">总提交 <strong id="stat-total">—</strong></span>
      <span class="stat-pill">今日新增 <strong id="stat-today">—</strong></span>
      <span class="stat-pill">本周新增 <strong id="stat-week">—</strong></span>
      <span class="stat-pill stat-pill-hot">本周访问总次数 <strong id="stat-visits-week">—</strong></span>
    </div>
  </header>

  <div class="admin-toolbar">
    <input type="text" id="search" class="ctrl-input" placeholder="搜姓名 / 机构 / 联系方式">
    <button id="refresh-btn" class="ctrl-btn">刷新</button>
  </div>

  <div id="auth-prompt" class="auth-prompt" hidden>
    <h3>需要后台 key</h3>
    <p>URL 缺少 <code>?key=</code> 参数，访问被拒绝。</p>
  </div>

  <table id="visitors-table" class="visitors-table" hidden>
    <thead>
      <tr>
        <th>时间</th>
        <th>姓名</th>
        <th>机构</th>
        <th>联系方式</th>
        <th>留言</th>
        <th>IP</th>
        <th>本周访问</th>
      </tr>
    </thead>
    <tbody id="visitors-body"></tbody>
  </table>

  <div id="loading" class="loading-state">加载中…</div>
</div>

<script src="./js/cb-v2.js"></script>
<script src="./js/admin.js"></script>
</body>
</html>
